name: Import verified Codex development commits

on:
  workflow_dispatch:
    inputs:
      expected_head:
        description: Exact commit in the uploaded development bundle
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: codex-transfer
  cancel-in-progress: false

jobs:
  import:
    if: github.repository == 'yoonjl-svg/halfsword-codex' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify bundle and preserve both histories
        env:
          EXPECTED_HEAD: ${{ inputs.expected_head }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$EXPECTED_HEAD" =~ ^[0-9a-f]{40}$ ]]
          test "$(git remote get-url origin)" = "https://github.com/yoonjl-svg/halfsword-codex"
          test -f .codex-transfer/work.bundle

          # Read the public original only; every write below targets this repository.
          git -c http.https://github.com/.extraheader= fetch --no-tags \
            https://github.com/yoonjl-svg/halfsword.git \
            14bcf1fe6bd205c775db91aa4ca36b9841b6d2bd
          git bundle verify .codex-transfer/work.bundle
          git fetch .codex-transfer/work.bundle \
            refs/heads/codex/hybrid-support:refs/remotes/codex-import/verified
          imported=$(git rev-parse refs/remotes/codex-import/verified)
          test "$imported" = "$EXPECTED_HEAD"
          git merge-base --is-ancestor 14bcf1fe6bd205c775db91aa4ca36b9841b6d2bd "$imported"

          # Workflow files are published through the workflow-authorized API first.
          # The Actions token must never need to introduce or change a workflow.
          git diff --exit-code "$GITHUB_SHA" "$imported" -- .github/workflows
          tree=$(git rev-parse "${imported}^{tree}")
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          merged=$(printf 'Import verified Codex source %s\n' "$imported" |
            git commit-tree "$tree" -p "$GITHUB_SHA" -p "$imported")
          test "$(git rev-parse "${merged}^{tree}")" = "$tree"

          # Fast-forward only. Concurrent remote changes cause a rejection.
          git push --atomic origin \
            "${merged}:refs/heads/main" \
            "${merged}:refs/heads/codex/hybrid-support"
          printf 'Imported source: `%s`\n\nRemote merge: `%s`\n\nTree: `%s`\n' \
            "$imported" "$merged" "$tree" >> "$GITHUB_STEP_SUMMARY"
