# main 브랜치에 올라오면 자동으로 빌드해서 GitHub Pages에 올린다.
# 처음 한 번: 저장소 Settings → Pages → Source 를 "GitHub Actions" 로 바꿔야 한다.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # One-time recovery for our 2026-10-16 import: the workflow timed out,
      # but Pages retained this exact deployment and rejected subsequent builds.
      # Uses the existing pages:write permission; no live deployment is removed.
      - name: Release the known timed-out Pages deployment
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            if (owner !== 'yoonjl-svg' || repo !== 'halfsword-codex') return;
            const deploymentId = 'e2f04f61e0acdfd8208b5dd4f98d6a2f4aa2d261';
            const args = { owner, repo, deploymentId };
            let result;
            try {
              result = await github.request('GET /repos/{owner}/{repo}/pages/deployments/{deploymentId}', args);
            } catch (error) {
              if (error.status === 404) { core.notice('The known Pages deployment is no longer pending.'); return; }
              throw error;
            }
            const state = result.data.status;
            core.notice(`Known Pages deployment ${deploymentId}: ${state}`);
            if (['succeed', 'succeeded', 'finished', 'failed', 'cancelled', 'canceled', 'deployment_failed', 'deployment_cancelled'].includes(state)) return;
            if (!['deployment_in_progress', 'syncing_files', 'finalizing', 'queued', 'pending', 'in_progress', 'deployment_queued'].includes(state)) {
              throw new Error(`Unknown Pages state; refusing to cancel: ${state}`);
            }
            await github.request('POST /repos/{owner}/{repo}/pages/deployments/{deploymentId}/cancel', args);
            core.notice(`Cancelled only the known stale Pages deployment ${deploymentId}.`);
            await new Promise(resolve => setTimeout(resolve, 3000));
      - id: deployment
        uses: actions/deploy-pages@v4
