name: Daily developer exchange

on:
  push:
    branches: [main]
    paths:
      - 'docs/dev_exchange/notes/**'
      - 'tools/dev_exchange/**'
      - '.github/workflows/dev-exchange.yml'
  schedule:
    - cron: '30 14 * * *' # 23:30 Asia/Seoul: publish today's report
    - cron: '45 14,15 * * *' # 23:45 / 00:45 KST: publication-only catch-up
    - cron: '2,7,12,17 15 * * *' # 00:02/07/12/17 KST: bounded receive retries; actual clock is authoritative
  workflow_dispatch:
    inputs:
      mode:
        description: Validate our tooling, publish a closed day, or receive only during 00:00–00:20 KST
        required: true
        default: validate
        type: choice
        options: [validate, publish, receive]
      date:
        description: Reporting day in Korea (YYYY-MM-DD); empty publishes the latest closed day
        required: false
        type: string

permissions:
  contents: write
  actions: read

concurrency:
  group: dev-exchange-archive
  cancel-in-progress: false

jobs:
  exchange:
    if: github.repository == 'yoonjl-svg/halfsword-codex' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          path: source
          fetch-depth: 0
      - name: Validate protocol implementation
        run: python3 -B -m unittest discover -s source/tools/dev_exchange -p 'test_*.py'
      - name: Verify read access to our document archive only
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'validate'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 -B - <<'PY'
          import sys
          sys.path.insert(0, 'source/tools/dev_exchange')
          import exchange
          cfg = exchange.config('source')
          for repo, ref in [(cfg['repo'], cfg['report_ref'])]:
              value = exchange.api(f'repos/{repo}/git/ref/heads/{ref}')
              print(f"Readable branch: {repo}@{ref} = {value['object']['sha']}")
          PY
      - name: Resolve reporting day without moving the cutoff
        id: request
        env:
          GH_TOKEN: ${{ github.token }}
          REQUEST_MODE: ${{ inputs.mode }}
          REQUEST_DATE: ${{ inputs.date }}
          SCHEDULE: ${{ github.event.schedule }}
        shell: bash
        run: |
          python3 - <<'PY'
          import os, subprocess, sys
          sys.path.insert(0, 'source/tools/dev_exchange')
          import exchange
          created = subprocess.check_output(['gh', 'api', 'repos/' + os.environ['GITHUB_REPOSITORY'] + '/actions/runs/' + os.environ['GITHUB_RUN_ID'], '--jq', '.created_at'], text=True).strip()
          request = exchange.resolve_request(exchange.config('source'), os.environ['GITHUB_EVENT_NAME'], os.environ.get('SCHEDULE'), os.environ.get('REQUEST_MODE'), os.environ.get('REQUEST_DATE'), created)
          mode, day = request['mode'], request['date']
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f'mode={mode}\ndate={day}\nretry_deferred={str(request["retry_deferred"]).lower()}\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as f:
              f.write(f'Mode: `{mode}`. Reporting day (Korea): `{day}`. Run created: `{created}`. Trigger schedule (UTC): `{os.environ.get("SCHEDULE", "")}`.\n\nScheduled Actions may be delayed; this is not an exact-time observation or a semantic AI review.\n')
          PY
      - name: Validate current authored notes before publication
        if: steps.request.outputs.mode == 'publish' || steps.request.outputs.mode == 'validate'
        run: python3 -B source/tools/dev_exchange/exchange.py validate-notes --repo-root source
      - uses: actions/checkout@v4
        if: steps.request.outputs.mode != 'validate'
        with:
          path: reports
          ref: dev-exchange
          fetch-depth: 1
      - name: Publish or receive fixed-day documents
        id: collect
        if: steps.request.outputs.mode != 'validate'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          EXCHANGE_MODE: ${{ steps.request.outputs.mode }}
          EXCHANGE_DATE: ${{ steps.request.outputs.date }}
          RETRY_DEFERRED: ${{ steps.request.outputs.retry_deferred }}
        shell: bash
        run: |
          set -euo pipefail
          args=()
          if [[ "$EXCHANGE_MODE" == receive && "$RETRY_DEFERRED" == true ]]; then
            args+=(--retry-deferred)
          fi
          result=0
          python3 -B source/tools/dev_exchange/exchange.py "$EXCHANGE_MODE" --date "$EXCHANGE_DATE" --repo-root source --output-root reports "${args[@]}" > "$RUNNER_TEMP/exchange-result.json" || result=$?
          cat "$RUNNER_TEMP/exchange-result.json"
          python3 -B source/tools/dev_exchange/workflow.py --result "$RUNNER_TEMP/exchange-result.json" --exit-code "$result"
      - name: Archive only in the document branch
        if: ${{ !cancelled() && (steps.collect.outcome == 'success' || steps.collect.outcome == 'failure') }}
        env:
          EXCHANGE_MODE: ${{ steps.request.outputs.mode }}
          EXCHANGE_DATE: ${{ steps.request.outputs.date }}
        working-directory: reports
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = dev-exchange
          case "$(git remote get-url origin)" in
            https://github.com/yoonjl-svg/halfsword-codex|https://github.com/yoonjl-svg/halfsword-codex.git) ;;
            *) exit 1 ;;
          esac
          git add -- docs
          if git diff --cached --quiet; then
            printf 'No new report data; existing dated records retained.\n' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "Developer exchange ${EXCHANGE_MODE} ${EXCHANGE_DATE} [skip ci]"
          git push origin HEAD:refs/heads/dev-exchange
          printf 'Archived in dev-exchange; game main and peer repository were not written.\n' >> "$GITHUB_STEP_SUMMARY"
      - name: Verify published bytes from our remote archive
        if: steps.request.outputs.mode == 'publish' && steps.collect.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          EXCHANGE_DATE: ${{ steps.request.outputs.date }}
        run: python3 -B source/tools/dev_exchange/exchange.py check-publication --repo-root source --date "$EXCHANGE_DATE"
      - name: Surface failure after preserving its receipt
        if: ${{ !cancelled() && steps.collect.outcome == 'failure' }}
        run: |
          printf 'Publication/reception failed. Check the archive step for receipt persistence. Semantic review is still pending.\n' >> "$GITHUB_STEP_SUMMARY"
          exit 1
