<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1b1714" />
    <link rel="icon" href="data:," />
    <title>슈바르츠 외형 시안 · Stillness</title>
    <style>
      :root { color-scheme: dark; --ink: #f3e9d8; --dim: #c0b29c; --line: #51483e; --accent: #d1ac73; }
      * { box-sizing: border-box; }
      body { margin: 0; background: #1b1714; color: var(--ink); font-family: system-ui, -apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; }
      main { max-width: 1100px; margin: 0 auto; padding: max(22px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left)); }
      .eyebrow { margin: 0 0 9px; color: var(--accent); font-size: 11px; font-weight: 600; letter-spacing: .2em; }
      h1 { margin: 0 0 10px; font-size: clamp(24px, 4vw, 34px); font-weight: 650; letter-spacing: -.035em; }
      .intro { margin: 0 0 20px; max-width: 660px; color: var(--dim); font-size: 14px; line-height: 1.7; word-break: keep-all; }
      #viewer { position: relative; height: min(65svh, 700px); min-height: 340px; overflow: hidden; border: 1px solid var(--line); border-radius: 12px; background: #403c36; }
      #character-canvas { display: block; width: 100%; height: 100%; touch-action: none; }
      #character-canvas:focus-visible { outline: 2px solid var(--accent); outline-offset: -4px; }
      .pose-label { position: absolute; top: 14px; left: 14px; margin: 0; padding: 7px 10px; background: #24201bd9; color: #ded3c1; border: 1px solid #ffffff16; border-radius: 5px; font-size: 11px; letter-spacing: .05em; pointer-events: none; }
      #viewer-status { position: absolute; inset: 0; display: grid; place-content: center; justify-items: center; gap: 15px; padding: 28px; text-align: center; background: #302c27ed; }
      #viewer-status[hidden], [hidden] { display: none !important; }
      #status-text { max-width: 320px; margin: 0; font-size: 14px; line-height: 1.75; word-break: keep-all; }
      .toolbar { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; padding: 13px 0 18px; }
      .hint { margin: 0; color: var(--dim); font-size: 12px; line-height: 1.65; }
      .controls { display: flex; gap: 7px; }
      button, .play-link { min-height: 44px; border: 1px solid var(--line); border-radius: 7px; padding: 10px 14px; font: inherit; font-size: 13px; text-decoration: none; touch-action: manipulation; }
      button { background: #2d2721; color: var(--ink); cursor: pointer; }
      button:disabled { opacity: .45; cursor: default; }
      button:not(:disabled):hover { background: #41382d; }
      button:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; }
      .zoom { min-width: 44px; padding: 7px 12px; font-size: 20px; }
      nav { display: flex; flex-wrap: wrap; gap: 10px; padding-top: 17px; border-top: 1px solid var(--line); }
      .play-link { display: inline-flex; align-items: center; justify-content: center; background: var(--accent); color: #251c12; font-weight: 650; }
      .play-link.secondary { background: transparent; color: #ded0b8; font-weight: 450; }
      .play-link:hover { filter: brightness(1.08); }
      noscript p { padding: 16px; background: #403127; color: var(--ink); }
      @media (max-width: 520px) {
        main { padding-top: max(18px, env(safe-area-inset-top)); }
        .intro { font-size: 13px; margin-bottom: 16px; }
        #viewer { height: 56svh; min-height: 330px; }
        .toolbar { align-items: flex-start; }
        .hint { flex: 1 1 120px; }
        nav .play-link { flex: 1 1 145px; padding-inline: 10px; }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <p class="eyebrow">STILLNESS · CHARACTER STUDY</p>
        <h1>슈바르츠 외형 시안</h1>
        <p class="intro">외형을 돌려 보는 화면입니다. 전투 동작·피해 검사는 플레이판에서 확인하세요.</p>
      </header>
      <section id="viewer" aria-label="슈바르츠 3D 외형" aria-busy="true">
        <canvas id="character-canvas" tabindex="0" aria-label="슈바르츠 모델. 드래그로 회전, 두 손가락 또는 휠로 확대. 방향키로 회전, 더하기와 빼기로 확대 축소, Home으로 처음 시점."></canvas>
        <p class="pose-label">정지 자세 · 외형 보기</p>
        <div id="viewer-status">
          <p id="status-text" role="status" aria-live="polite">슈바르츠 외형을 불러오는 중입니다…</p>
          <button id="retry-load" type="button" hidden>다시 불러오기</button>
        </div>
      </section>
      <div class="toolbar">
        <p class="hint">드래그로 회전<br />두 손가락 또는 휠로 확대·축소</p>
        <div class="controls" aria-label="시점 조절">
          <button id="zoom-out" class="zoom" type="button" aria-label="축소" disabled>−</button>
          <button id="zoom-in" class="zoom" type="button" aria-label="확대" disabled>+</button>
          <button id="reset-view" type="button" disabled>처음 시점</button>
        </div>
      </div>
      <nav aria-label="게임에서 비교하기">
        <a class="play-link" href="./?characterModel=tripo&amp;foe=margarethe&amp;weapon=longsword&amp;stage=cathedral">새 외형으로 플레이</a>
        <a class="play-link secondary" href="./?foe=margarethe&amp;weapon=longsword&amp;stage=cathedral">기존 외형으로 플레이</a>
      </nav>
      <noscript><p>외형을 보려면 브라우저의 자바스크립트를 켜 주세요.</p></noscript>
    </main>
    <script type="module" src="/src/character_viewer.js"></script>
  </body>
</html>
