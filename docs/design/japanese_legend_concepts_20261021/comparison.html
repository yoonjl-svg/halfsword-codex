<!doctype html>
<html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>일본 레전드 · 외형 시안</title>
<style>
@font-face{font-family:Pretendard;src:url('../../../public/fonts/Pretendard-Regular.subset.woff2')}
@font-face{font-family:Pretendard;src:url('../../../public/fonts/Pretendard-SemiBold.subset.woff2');font-weight:600}
*{box-sizing:border-box}body{margin:0;background:#1c1813;color:#c7b899;font-family:Pretendard,sans-serif;padding:28px 38px}header{max-width:940px;margin:0 auto 20px;display:flex;justify-content:space-between;align-items:baseline}h1{font-size:20px;font-weight:600;margin:0}header p{font-size:12px;color:#958870;margin:0}main{display:grid;grid-template-columns:1fr 1fr;gap:24px;max-width:940px;margin:auto}article{position:relative;border:1px solid #927845;padding:24px 28px 26px;background:radial-gradient(ellipse at 50% 36%,#383125 0%,#28221b 45%,#211b16 80%);border-radius:4px;box-shadow:inset 0 0 0 3px #211b16,inset 0 0 0 4px #57482f}figure{aspect-ratio:1;margin:0 0 16px;display:grid;place-items:center}img{width:90%;height:90%;object-fit:contain}h2{font-size:24px;font-weight:600;margin:0 0 8px;text-align:center;color:#dac8a3}.tag{font-size:11px;position:absolute;top:16px;left:18px;color:#ac9161}p{font-size:15px;line-height:1.6;margin:0;text-align:center;color:#b6a88e}.detail{font-size:12px;color:#8f816a;margin-top:10px}footer{text-align:center;font-size:12px;color:#8d816b;margin-top:20px}
@media(max-width:700px){body{padding:18px 16px}main{gap:12px}article{padding:22px 12px 18px}h1{font-size:16px}h2{font-size:17px}p{font-size:12px}.detail{font-size:10px}header p{font-size:10px}figure{margin-bottom:10px}.tag{top:10px;left:10px}}
</style>
<header><h1>일본 레전드 · 외형 시안</h1><p>이미지 콘셉트 · 선택 전</p></header>
<main>
<article><span class="tag">A</span><figure><img src="amenohabakiri-original.png" alt="은빛의 넓은 직선 날, 적갈색 손잡이와 고리 끝장식의 아메노하바키리"></figure><h2>아메노하바키리</h2><p>큰 뱀을 벤 오래된 신검</p><p class="detail">넓은 은빛 날 · 적갈색 끈 · 고리형 끝장식</p></article>
<article><span class="tag">B</span><figure><img src="kusanagi-original.png" alt="청자빛 은색 날, 녹청색 손잡이와 곡옥 장식의 쿠사나기"></figure><h2>쿠사나기</h2><p>풀과 바람을 가르는 성검</p><p class="detail">잎처럼 뻗은 날 · 녹청색 끈 · 곡옥 장식</p></article>
</main><footer>신화에서 착안한 창작 외형 · 실제 유물 복원 및 게임 적용 화면 아님</footer>
</html>
