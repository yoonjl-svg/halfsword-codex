<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Stillness · 막기 입력으로 찌르기</title><style>
@font-face{font-family:Stillness;src:url(game/fonts/Pretendard-Regular.subset.woff2)}*{box-sizing:border-box}html,body{margin:0;height:100%;background:#1e1d19;color:#dbd0b7;font-family:Stillness,serif}body{display:flex;flex-direction:column}header{display:flex;align-items:center;gap:8px;padding:6px max(10px,env(safe-area-inset-right));border-bottom:1px solid #796c4f;font-size:12px}button,select{font:inherit;color:#e5d9bc;background:#333027;border:1px solid #918164;padding:8px 10px;border-radius:0;cursor:pointer}button:focus,select:focus{outline:2px solid #d6ad65}#mode{max-width:195px}#status{flex:1;min-width:0;color:#b8b09f;font-size:11px}iframe{border:0;width:100%;flex:1;min-height:0;background:#171713}dialog{width:min(560px,94vw);max-height:94dvh;overflow:auto;background:#25231e;color:#dbd0b7;border:2px solid #958363;padding:22px}dialog::backdrop{background:#111e}h1{font-size:22px;font-weight:normal;margin:0 0 12px}p{font-size:13px;line-height:1.6;color:#c1b8a4}label{display:grid;grid-template-columns:90px 1fr;align-items:center;gap:10px;margin:10px 0;font-size:14px}label select{width:100%;min-width:0}footer{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}small{font-size:11px;color:#aaa18e}@media(max-height:470px){dialog{padding:13px;width:640px}h1{font-size:18px;margin-bottom:6px}label{margin:6px 0}p{margin:5px 0;font-size:12px;line-height:1.4}footer{margin-top:8px}}@media(max-width:500px){header{flex-wrap:wrap}#status{flex-basis:100%}}
</style></head><body><header>
<select id="mode" aria-label="비교 조합"><option value="press">입력형 · 피해 감소 45%</option><option value="light">입력형 · 피해 감소 30%</option><option value="unshielded">입력형 · 피해 감소 없음</option><option value="contact">접촉형 + 전진 스텝</option></select><button id="restart">다시 시작</button><span id="status">연습 조건을 골라 주세요.</span><button id="settings">연습 설정</button></header>
<iframe id="game" title="Stillness 레이피어 막아찌르기 시험" allow="autoplay; fullscreen 'none'"></iframe>
<dialog id="options"><h1>레이피어 · 누르면 막아찌르기</h1><p>막기 버튼을 누르면 칼이 닿기를 기다리지 않고 방어선을 따라 약하게 찌릅니다. 놓아도 찌르기는 한 번 마치며, 다시 누르면 다음 공격을 할 수 있습니다. 휴대폰은 가로로 돌려 주세요.</p>
<label>내 역할<select id="role"><option value="defender">레이피어로 막아찌르기</option><option value="attacker">롱소드로 막아찌르기 상대하기</option></select></label>
<p id="hint"></p><p id="values"></p><small>피해 감소는 한 번의 동작에서 뻗고 버티는 약0.40초에만 적용됩니다. 회수하거나 동작이 중단되면 사라집니다. 명중은 실제 칼 충돌로 결정되며, 거리가 멀면 빗나갑니다. 새 안은 별도 자동 스텝·추가 튕김 충격이 없습니다. 시험 기록은 탭 안에만 남습니다.</small>
<footer><button id="close">돌아가기</button><button id="start">이 조건으로 시작</button></footer></dialog><script>
const $=id=>document.getElementById(id),q=new URLSearchParams(location.search);let running=false;
for(const id of ['mode','role'])if([...$(id).options].some(o=>o.value===q.get(id)))$(id).value=q.get(id);
const values={light:'같은 공격 · 받는 피해 30% 감소',press:'약한 타격: 피해 60% · 받는 피해 45% 감소 · 뻗기0.28초/유지0.12초/회수0.24초',unshielded:'같은 공격 · 받는 피해 감소만 끔',contact:'이전 접촉 후 발동 + 전진 입력 스텝 · C 손길'};
function hint(){$('hint').textContent=$('role').value==='attacker'?'상대는 들어오는 공격을 읽으면 같은 버튼 기술을 사용합니다.':'브론은 사인검을 사용합니다. 닿을 거리에서 막기(F)를 눌러 보세요. 누르고 있어도 한 번만 공격합니다. 동작을 마친 뒤 놓았다 다시 누르면 재발동합니다.';$('values').textContent=values[$('mode').value];}
function start(){const role=$('role').value,mode=$('mode').value,impulse='1';history.replaceState(null,'',`?mode=${mode}&role=${role}&impulse=${impulse}`);const a=new URLSearchParams({test:'1',weapon:role==='defender'?'rapier':'longsword',foeWeapon:role==='defender'?'sain':'rapier',foe:'bran',stage:'poseidon',uniqueStage:'2',slowMo:'0',rev:'press-trade1',role,mode,impulse});$('game').src='game/index.html?'+a;running=true;$('options').close();$('status').textContent='불러오는 중…';}
$('role').onchange=hint;hint();$('options').showModal();$('settings').onclick=()=>{$('options').showModal();$('game').contentWindow?.postMessage({type:'lab-pause'},location.origin);};$('close').onclick=()=>{if(running)$('options').close();};$('start').onclick=start;$('restart').onclick=()=>running?start():$('options').showModal();$('mode').onchange=()=>{hint();if(running)start();};
window.addEventListener('message',e=>{if(e.origin!==location.origin||e.source!==$('game').contentWindow||e.data?.type!=='stillness-rapier-lab')return;const s=e.data;$('status').textContent=`${s.role==='defender'?'내':'상대'} 막아찌르기 ${s.starts}회${s.active?' · 찌르는 중':''}${s.protected?' · 피해 감소 중':''}${s.gameState==='menu'?' · 게임 시작을 눌러 주세요.':''}`;});
</script></body></html>
