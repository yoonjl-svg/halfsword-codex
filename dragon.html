<!doctype html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"><meta name="theme-color" content="#20241f"><link rel="icon" href="data:,"><title>Stillness · 폐성의 수호룡</title></head>
<body>
<canvas id="game" aria-label="용 특별 전투"></canvas>
<div id="hud" hidden>
  <div class="stage"><span>특별 전투</span><b>무너진 성채</b></div>
  <div class="boss"><b>폐성의 수호룡</b><div class="boss-track" role="meter" aria-label="용 생명력" aria-valuemin="0" aria-valuemax="480"><i id="bossFill"></i></div></div>
  <button id="pause" class="small" aria-label="일시정지">Ⅱ</button>
  <div id="cue" role="status"><b></b><span></span></div>
  <div id="feedback" aria-live="polite"></div>
  <div id="meters"></div>
  <div id="staminaReadout">기력 <b>300</b><span> / 300</span></div>
  <div id="stick" aria-label="이동 조이스틱"><i></i></div>
  <button id="guard" aria-label="막기, 누르고 있기">막기</button>
</div>
<section id="menu" class="shade">
  <div class="panel">
    <span class="eyebrow">STILLNESS · 특별 전투 시안</span>
    <h1>폐성의 수호룡</h1>
    <p class="story">지킬 사람이 사라진 성.<br>늙은 용은 아직 그 문을 지키고 있습니다.</p>
    <label class="weapon-label" for="weapon">무기</label><select id="weapon"></select>
    <div class="rules"><span>이동 ×1.5</span><span>기력 300</span><span>약공격 막기</span></div>
    <p class="help">왼손으로 이동 · 화면을 끌어 베기 · 톡 눌러 찌르기<br>작은 물기와 앞발은 막고, 큰 공격은 피하세요.<br>화염은 돌기둥 뒤에서 피할 수 있습니다.</p>
    <p class="desktop">WASD 이동 · 마우스 검 조작 · F 막기 · Esc 일시정지</p>
    <button id="start" class="primary" disabled>준비 중…</button>
    <a class="back" href="./index.html">소개로 돌아가기</a>
  </div>
</section>
<section id="pauseMenu" class="shade" hidden><div class="panel compact"><span class="eyebrow">STILLNESS</span><h2>잠시 숨을 고릅니다</h2><button id="resume" class="primary">계속하기</button><button id="restartPause">다시 도전</button><button id="choosePause">무기 고르기</button></div></section>
<section id="result" class="shade" hidden><div class="panel compact"><span class="eyebrow">특별 전투</span><h2 id="resultTitle"></h2><p id="resultText"></p><dl id="resultStats"></dl><button id="restart" class="primary">다시 도전</button><button id="choose">무기 고르기</button><a class="back" href="./index.html">소개로 돌아가기</a></div></section>
<div id="fatal" hidden role="alert"></div>
<script type="module" src="/src/dragon/main.js"></script>
</body></html>
