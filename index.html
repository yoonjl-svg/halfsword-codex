<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#1b1410" />
    <!-- 탭 아이콘 (브라우저의 favicon.ico 자동 요청 404 도 막는다) — 앱 아이콘과 같은 도트 그림, public/icons/ (크기는 파일 그대로 — 도트가 뭉개지지 않게) -->
    <link rel="icon" type="image/png" sizes="32x32" href="./icons/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="64x64" href="./icons/favicon-64.png" />
    <!-- 설치되는 앱(PWA, docs/pwa_2026-10-13.md): 매니페스트 · 아이폰 홈 화면 아이콘·이름 · 전체 화면에서 상태 막대 아래까지 그린다(안전 영역은 아래 --safe-*) -->
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" sizes="192x192" href="./icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="적막" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Stillness</title>
    <!-- 화면 글꼴 (10/14 10:4x 사장님 '갈무리+자카드보다 프리텐다드+킨젤' — 웹폰트 비교 3안, docs/ui/webfont_2026-10-14.md): 우리 파일만 쓴다(public/fonts — 오프라인 앱이라
         바깥 글꼴 서버 없음, 출처·라이선스 public/fonts/README.md). 첫 화면(메뉴)에 쓰는 셋은 미리 받는다: 프리텐다드 보통(부제·설정 줄) · 볼드('싸움 시작') · Cinzel 라틴(제목 'Stillness') -->
    <link rel="preload" href="/fonts/Pretendard-Regular.subset.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/Pretendard-Bold.subset.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/Cinzel-latin.woff2" as="font" type="font/woff2" crossorigin />
    <style>
      /* ── 화면 글꼴: Cinzel = 라틴 글자에만(unicode-range = 두 조각에 실제로 든 글자 — 숫자·기호·빈칸은 프리텐다드로). 굵기 축 400–900 한 파일.
         프리텐다드 = 한글·숫자·기호 (만든 이의 KS X 1001 서브셋 그대로 — 쓰는 굵기 셋 400 · 600 · 700, 그 밖의 굵기는 가까운 파일로 그린다).
         보충 = 프리텐다드에 없는 글자만: 중국 유파 원어의 한자 43 자 + Ⅰ·Ⅱ (Noto Sans TC 조각) · ▮▯↻ (Noto Sans Math 조각). 한 굵기 파일이라 굵기 범위로 적어 흉내 굵기를 막는다 ── */
      @font-face { font-family: 'Cinzel'; src: url('/fonts/Cinzel-latin.woff2') format('woff2'); font-weight: 400 900; font-style: normal; font-display: swap;
        unicode-range: U+0041-005A, U+0061-007A, U+00C0-00D6, U+00D8-00F6, U+00F8-00FF, U+0102, U+0131, U+0152-0153; }
      @font-face { font-family: 'Cinzel'; src: url('/fonts/Cinzel-latin-ext.woff2') format('woff2'); font-weight: 400 900; font-style: normal; font-display: swap;
        unicode-range: U+0100-0101, U+0103-0107, U+010A-0113, U+0116-011B, U+011E-0123, U+0126-0127, U+012A-012B, U+012E-0130, U+0132-0133, U+0136-0137, U+0139-0148, U+014A-014D, U+0150-0151, U+0154-015B, U+015E-0167, U+016A-016B, U+016E-017E, U+0218-021B, U+1E80-1E85, U+1EF2-1EF3; }
      @font-face { font-family: 'Pretendard'; src: url('/fonts/Pretendard-Regular.subset.woff2') format('woff2'); font-weight: 400; font-style: normal; font-display: swap; }
      @font-face { font-family: 'Pretendard'; src: url('/fonts/Pretendard-SemiBold.subset.woff2') format('woff2'); font-weight: 600; font-style: normal; font-display: swap; }
      @font-face { font-family: 'Pretendard'; src: url('/fonts/Pretendard-Bold.subset.woff2') format('woff2'); font-weight: 700; font-style: normal; font-display: swap; }
      @font-face { font-family: 'Noto Sans TC'; src: url('/fonts/NotoSansTC-hanja.woff2') format('woff2'); font-weight: 100 900; font-style: normal; font-display: swap;
        unicode-range: U+2160-2161, U+4E09, U+523A, U+528D, U+52E2, U+53E3, U+53F3, U+5766, U+593E, U+5B88, U+5DE6, U+5FA1, U+6380, U+63A0, U+63A3, U+6492, U+64A9, U+64CA, U+6582, U+66F8, U+6B65, U+74B0, U+76F4, U+770B, U+7B26, U+7FC5, U+7FFC, U+8170, U+8179, U+82B1, U+84CB, U+864E, U+8C79, U+8DE8, U+8E72, U+8ECA, U+9001, U+9006, U+9023, U+9802, U+982D, U+9C57, U+9CF3, U+9EDE; }
      @font-face { font-family: 'Noto Sans Math'; src: url('/fonts/NotoSansMath-symbols.woff2') format('woff2'); font-weight: 100 900; font-style: normal; font-display: swap;
        unicode-range: U+21BB, U+25AE-25AF; }
      :root {
        /* ── 글자 규칙 (10/14 — docs/ui/hud_type_system_2026-10-10.md §16 · docs/ui/webfont_2026-10-14.md): 글꼴 하나 · 크기 세 단계 + 큰 글자 예외 둘 · 굵기 셋 · 글자 색 넷 ──
           사장님 10/14 10:3x '폰트 크기 규칙을 다시 · 다소 커 · 굵은 건 조금 얇게' · 10:4x '프리텐다드 + 킨젤' · 10:5x '굵기 한 단계만 · 색도 몇 개 규칙 이내 · 크기 다이내믹 절제' ·
           11:0x '대면과 영문 제목은 커도 돼 · 카드 등급 색은 유지(재미 요소)' */
        /* 글자 색 넷 — 요소마다 이 가운데 하나. 색으로 강조하는 것은 강조 색 하나뿐. 카드 등급 색(--tier-*)은 예외(사장님 결정 10/14 11:0x) */
        --c-text: #f3e9d8; /* 본문: 따뜻한 흰색 — 이름·칸 첫 줄·카드 설명·창 줄·판 알림·안내 알약 */
        --c-sub: #b8a88e; /* 보조: 흐린 색 — 칸 둘째 줄(원어·설명·꼬리표)·칭호·대사·카드 부제·창 부제·안내 목록 */
        --c-accent: #d9a441; /* 강조: 금색 — 누를 것·꼭 봐야 할 것만 (카드 고르기 안내 · 누를 번호 · 비기 창 열림 · 주 단추·'내 무기' 바탕) */
        --c-alert: #e48e8b; /* 상태·상대: 옅은 붉은색 — 감정 문장(상태 3종, 사장님 10/10 '한 색') · '상대 무기' 알약 바탕은 같은 계열의 짙은 색 */
        --c-on-accent: #1b1410; /* 강조 바탕(금색 단추·알약) 위 글자 = 판 바탕색 */
        --ink: var(--c-text);
        --dim: var(--c-sub);
        --accent: var(--c-accent);
        --panel: rgba(24, 18, 14, 0.88);
        --line: rgba(243, 233, 216, 0.18);
        --red: #b3261e;
        --blue: #3f6fb5;
        --font-ui: 'Cinzel', 'Pretendard', 'Noto Sans TC', 'Noto Sans Math', system-ui, -apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif; /* 10/14 라틴 글자 = Cinzel · 그 밖 = 프리텐다드 · 보충 둘 — 뒤 시스템 글꼴은 이모지만 */
        /* 크기 세 단계 — 평소 글자는 모두 이 셋 가운데 하나 (가장 큰 단계 ÷ 가장 작은 단계 = 17 / 12 ≈ 1.42) */
        --fs-s: 12px; /* 작게: 칸 둘째 줄 · 왼쪽 위 칸 · 안내 알약 · 카드 부제·등급·설명·특수 능력·알약·번호 · 창 안내 목록 */
        --fs-m: 14px; /* 보통: 칸 첫 줄 · 인물 소개 · 감정 줄 · 막기 · 카드 이름 · 창 부제·설정 줄·단추 */
        --fs-l: 17px; /* 크게: 창 제목(일시정지 · 승리 · 패배) · 돌려 달라는 안내 */
        /* 큰 글자 예외 둘 (사장님 10/14 11:0x '대면과 영문 제목은 커도 돼') — 이 둘 말고는 위 세 단계뿐 */
        --fs-display: clamp(32px, 9vmin, 56px); /* 판 알림 '대면' · 승리 · 패배 — 지금 크기 그대로 */
        --fs-wordmark: 20px; /* 메뉴 영문 제목 'Stillness' (Cinzel) — 웹폰트 비교 3안의 크기 */
        /* 굵기 셋 (사장님 10/14 10:5x '한 단계만 얇게': 800 → 700 · 700 → 600 · 500 → 400, 400 그대로) */
        --fw-body: 400;
        --fw-label: 600; /* 알림 줄 · 카드 고르기 안내 · 알약 · 번호 · 고른 단추 (예전 700) */
        --fw-head: 700; /* 이름 · 칸 첫 줄 · 왼쪽 위 무대 줄 · 판 알림 · 창 제목 · 주 단추 · 막기 (예전 800) */
        --lh-tight: 1.25;
        --lh-text: 1.4;
        --ls-display: .06em;
        --ls-label: .04em;
        /* 외곽선 표준 하나 (모든 HUD 글자 — 밝은 하늘·모래 위에서도 윤곽이 선다). 큰 판 알림만 굵은 판 */
        --outline-c: #0d0907;
        --hud-outline: 1px 0 0 var(--outline-c), -1px 0 0 var(--outline-c), 0 1px 0 var(--outline-c), 0 -1px 0 var(--outline-c), 0 1px 3px rgba(13, 9, 7, .85), 0 0 8px rgba(13, 9, 7, .5);
        --hud-outline-display: 0 2px 0 var(--outline-c), 0 0 2px var(--outline-c), 0 3px 10px rgba(13, 9, 7, .7);
        /* 예전 HUD 색 토큰 아홉(--hud-guard · -guard-sub · -tech · -tech-sub · -state · -name · -epithet · -sys · -guide · --emo-revive)은 10/14 글자 색 넷으로 묶었다 (§16 대응표).
           ① 자세 · ② 기술 칸은 이제 같은 색(본문 / 보조) — ② 를 옅은 오렌지로 가르던 것(10/10 §13)을 걷고 자리로 가른다 */
        --hud-guide-bg: rgba(13, 9, 7, .5); /* 안내 알약 바탕 */
        /* 무기 등급 (예전 룰렛 색 그대로) — 글자 색 규칙의 예외: 카드 이름 · 등급 딱지 · 특수 능력 줄 · 테두리 · 빛 (사장님 10/14 11:0x '카드 등급 색은 유지. 재미 요소야') */
        --tier-trash: #b8b6b0; --tier-common: #fff3c4; --tier-rare: #8cc4ff; --tier-epic: #d6a8ff; --tier-legend: #ffd24a; --tier-mystery: #8fe3c6;
        --foe: #b0473b;
        /* 자리: 안전 영역 · 왼쪽 위/오른쪽 위 칸 폭 (가운데 일시정지 단추 38px 양옆 10px 비움) */
        --safe-t: max(12px, env(safe-area-inset-top));
        --safe-r: max(14px, env(safe-area-inset-right));
        --safe-l: max(14px, env(safe-area-inset-left));
        --safe-b: max(12px, env(safe-area-inset-bottom));
        --side-w: min(34vw, 300px);
        --slot-gap: 6px;
        --hint-b: var(--safe-b);
        --notice-up: 34px;
      }
      @media (orientation: portrait) {
        /* 세로: 칸 폭은 일시정지 단추까지 · 안내는 조이스틱(아래 20 + 110px) 위로 · 안내가 두 줄이라 알림 줄을 더 위로 */
        :root { --side-w: calc(50vw - 43px); --hint-b: calc(var(--safe-b) + 130px); --notice-up: 54px; }
      }
      * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
      button, input, select, textarea { font-family: inherit; } /* 단추·입력 칸도 화면 글꼴을 물려받는다 (브라우저 기본은 시스템 글꼴) — 크기·굵기는 저마다의 줄 그대로 */
      html, body {
        margin: 0; height: 100%; overflow: hidden; background: #1b1410; color: var(--c-text);
        font-family: var(--font-ui); font-weight: var(--fw-body);
        font-synthesis: none; /* 흉내 굵기·기울임을 만들지 않는다 (쓰는 굵기는 모두 파일이 있다 — 혹시 없는 굵기를 부르면 가까운 파일 그대로) */
        touch-action: none; overscroll-behavior: none; user-select: none; -webkit-user-select: none;
      }
      #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
      #game.pixel { image-rendering: pixelated; image-rendering: crisp-edges; }

      /* HUD: 붉은 테두리(출혈/통증) */
      #hud { position: fixed; inset: 0; display: none; pointer-events: none; }
      #hud.show { display: block; }
      #vignette { position: absolute; inset: 0; opacity: 0; transition: opacity .2s; will-change: opacity; transform: translateZ(0); /* 10/13: 한 층으로 통째 합성 — 사파리에서 일부 조각만 다시 그려지지 않게 */
        background: radial-gradient(ellipse at center, rgba(120,0,0,0) 45%, rgba(120,0,0,.55) 78%, rgba(60,0,0,.9) 100%); }
      /* 플레이어 감정(emotions.js): 지배 감정에 따라 가장자리 색이 다르다 — 공포 푸른 회색, 분노 붉음, 집념 금빛 */
      #emotion { position: absolute; inset: 0; opacity: 0; transition: opacity .4s; }
      #emotion[data-emotion="fear"] { background: radial-gradient(ellipse at center, rgba(60,80,110,0) 50%, rgba(60,80,110,.5) 85%, rgba(20,30,50,.8) 100%); }
      #emotion[data-emotion="anger"] { background: radial-gradient(ellipse at center, rgba(200,30,0,0) 55%, rgba(200,30,0,.45) 88%, rgba(120,0,0,.8) 100%); }
      #emotion[data-emotion="obsession"] { background: radial-gradient(ellipse at center, rgba(220,170,40,0) 55%, rgba(220,170,40,.4) 88%, rgba(140,90,0,.75) 100%); }
      #topButtons { position: fixed; top: max(8px, env(safe-area-inset-top)); z-index: 2; left: 50%; transform: translateX(-50%); display: none; gap: 8px; }
      #topButtons.show { display: flex; }
      .iconBtn { width: 38px; height: 38px; border-radius: 50%; border: 1px solid var(--line); background: var(--panel); color: var(--c-text); font-size: 17px; font-family: revert; } /* 글리프 단추 (일시정지 Ⅱ) — 글자 규칙 밖(그림). 글꼴은 브라우저 기본 단추 글꼴 그대로(revert — 10/14): 화면 글꼴 줄의 Ⅱ(Noto Sans TC 조각)는 위아래 가로획이 붙은 로마 숫자라 '멈춤' 그림으로 안 읽힌다 */

      /* ── 게임 화면 글자 (10/10 글자 체계): 칸마다 자리 하나 · 서식 하나 · 외곽선 하나. 시간은 main.js 가 게임 시간으로 센다 ── */
      /* D 판 알림 (판 시작 '대면' · 승리 · 패배): 가운데 — 가운데에는 이것만 뜬다 */
      #toast { position: fixed; left: 50%; top: 46%; transform: translate(-50%, -50%); font-size: var(--fs-display); font-weight: var(--fw-head); line-height: 1; letter-spacing: var(--ls-display); color: var(--c-text); text-shadow: var(--hud-outline-display); white-space: nowrap; pointer-events: none; opacity: 0; transition: opacity .3s; }
      #toast.show { opacity: 1; transition-duration: .2s; }
      /* E 알림 줄 (부활): 아래 가운데, 안내 위. 한 줄, 넘치면 … (감정 상태는 오른쪽 위 ③ 묶음으로 옮겼다) */
      #emoMsg { position: fixed; left: 50%; bottom: calc(var(--hint-b) + var(--notice-up)); transform: translateX(-50%); max-width: min(64vw, 480px); font-size: var(--fs-m); font-weight: var(--fw-label); line-height: var(--lh-tight); color: var(--c-text); text-shadow: var(--hud-outline); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; pointer-events: none; opacity: 0; transition: opacity .35s; }
      #emoMsg.show { opacity: 1; transition-duration: .2s; }
      #emoMsg[data-emotion="fear"], #emoMsg[data-emotion="obsession"], #emoMsg[data-emotion="anger"], #emoMsg[data-emotion="stiff"] { color: var(--c-alert); } /* 상태 3종 한 색 = 상태·상대 색 (경직은 main.js STIFF_TEXT 를 켰을 때만) */
      #emoMsg[data-emotion="revive"] { color: var(--c-text); text-shadow: var(--hud-outline), 0 0 10px rgba(255,205,110,.85), 0 0 22px rgba(255,190,80,.45); } /* 부활: 글자는 본문 색, 금빛 그늘(빛 효과)만 — 하늘에서 내린 빛 (src/revive_fx.js) */
      /* H 안내 (조작 안내): 아래 가운데 알약 — 바탕이 있으니 외곽선 없음. 가로 한 줄(…), 세로 두 줄 */
      #hint { position: fixed; bottom: var(--hint-b); left: 50%; transform: translateX(-50%); max-width: min(64vw, 520px); font-size: var(--fs-s); font-weight: var(--fw-body); line-height: var(--lh-text); color: var(--c-text); background: var(--hud-guide-bg); padding: 6px 12px; border-radius: 999px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; pointer-events: none; opacity: 0; transition: opacity .3s; }
      #hint.show { opacity: 1; transition-duration: .2s; }
      @media (orientation: portrait) { #hint { white-space: normal; text-align: center; width: max-content; max-width: calc(100vw - 2 * var(--safe-l)); word-break: keep-all; border-radius: 14px; } }

      /* 오른쪽 위 두 묶음 (10/10 19:2x 사장님 답 §13 → 20:3x §14 — docs/ui/hud_type_system_2026-10-10.md): ① 자세 · ② 패시브·비기 — 둘 다 줄 하나.
         줄 하나(.slot) = 첫 줄 b(이름 — 보통 · 700 · 본문 색) + 둘째 줄 small(원어 · 설명 · 꼬리표 — 작게 · 400 · 보조 색). 서식·외곽선·색 하나 — 두 묶음은 자리로 가른다 (10/14 §16) */
      .slot { text-align: right; text-shadow: var(--hud-outline); opacity: 0; transition: opacity .25s, translate .25s; }
      .slot.show { opacity: 1; transition-duration: .15s; }
      .slot b { display: block; font-size: var(--fs-m); font-weight: var(--fw-head); line-height: var(--lh-tight); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .slot small { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 1; overflow: hidden; font-size: var(--fs-s); font-weight: var(--fw-body); line-height: 1.35; margin-top: 1px; word-break: keep-all; }
      #guardName, .stack { position: fixed; right: var(--safe-r); width: var(--side-w); pointer-events: none; }
      /* ① 자세 (첫 칸, 높이 52px — 설명 두 줄까지). 10/14 03:3x: 싸움 중에는 늘 보이고 자세가 바뀌면 바꿔 끼운다 (main.js updateGuardName · guardVisible) */
      #guardName { top: var(--safe-t); height: 52px; }
      #guardName b, #techSlot b { color: var(--c-text); }
      #guardName small, #techSlot small { color: var(--c-sub); }
      #guardName small { -webkit-line-clamp: 2; }
      /* ② 를 담는 겉 칸 (main.js updateTechCue) — 자리를 차지하지 않는다 (숨기면 ② 가 숨는다) */
      #techCue { position: fixed; inset: 0; pointer-events: none; }
      #staminaHud { position: fixed; inset: 0; pointer-events: none; }
      .stamina-bar { position: absolute; width: 56px; height: 3px; transform: translate(-50%, -100%); background: rgba(24,18,14,.65); border-radius: 2px; box-shadow: 0 0 0 1px rgba(24,18,14,.55); overflow: hidden; }
      .stamina-bar > span { display: block; width: 100%; height: 100%; background: var(--c-text); transform-origin: left center; }
      .stamina-bar[data-exhausted="true"] { box-shadow: 0 0 0 1px var(--c-text); }
      /* ② 패시브·비기: 줄 하나(40px) — 자세 칸처럼 새 알림이 오면 그 자리에서 바꿔 끼운다. 10/14 03:1x: 마지막 기술이 계속 보인다(새 판에 비움),
         비기 창·고노센 준비만 잠깐 덮었다가 마지막 기술로 돌아온다 (main.js techPut · techTick) */
      .stack .slot { height: 40px; translate: 6px 0; }
      .stack .slot.show { translate: 0 0; }
      #techSlot { top: calc(var(--safe-t) + 52px + var(--slot-gap)); }
      /* 둘째 줄: 원어(.o)는 좁으면 … 으로 줄고 꼬리표(.t)는 늘 다 보인다 */
      .stack small { display: flex; justify-content: flex-end; white-space: nowrap; }
      .stack small .o { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
      .stack small .t { flex: none; }
      #techSlot .slot[data-kind="secretArm"].show { opacity: .6; } /* 고노센 준비 — 준비된 상태라 흐리게 */
      #techSlot .slot[data-kind="secretReady"].show { animation: slotPulse .6s ease-in-out infinite alternate; } /* 내 비기 창이 열림 — 지금 누를 때 */
      #techSlot .slot[data-kind="secretReady"] b { color: var(--c-accent); } /* 지금 누를 때 = 강조 색 (글자 색 규칙 — 누를 것·꼭 봐야 할 것만) */
      @keyframes slotPulse { from { opacity: .7; } to { opacity: 1; } }
      @media (prefers-reduced-motion: reduce) {
        .stack .slot { translate: none; }
        #techSlot .slot[data-kind="secretReady"].show { animation: none; }
      }
      /* 무기 등급 색: --tc = 글자 색, --tg = 은은한 빛 */
      [data-tier] { --tc: var(--tier-common); --tg: rgba(255,236,190,.28); }
      [data-tier="trash"] { --tc: var(--tier-trash); --tg: rgba(190,188,180,.2); }
      [data-tier="rare"] { --tc: var(--tier-rare); --tg: rgba(110,170,255,.45); }
      [data-tier="epic"] { --tc: var(--tier-epic); --tg: rgba(190,130,255,.5); }
      [data-tier="legend"] { --tc: var(--tier-legend); --tg: rgba(255,210,74,.6); }
      [data-tier="mystery"] { --tc: var(--tier-mystery); --tg: rgba(120,220,190,.45); } /* ??? 등급 (사장님 결정): 다른 등급과 겹치지 않는 옅은 청록 */

      /* 인물 소개 (이름 · 칭호 · 대사): 화면 가운데, 판 알림(#toast) 바로 아래 (10/14 사장님 '사이즈 통일해서 예전처럼 시작 때 보이게 가운데로'
         — docs/ui/hud_intro_2026-10-14.md). 세 줄 글자 크기는 하나(보통 --fs-m), 색만 다르다: 이름 = 본문 색(700) · 칭호 = 대사 = 보조 색(400).
         판이 시작되는 순간부터 발이 풀릴 때(ARENA.startHold)까지, 그리고 상대의 승리·부활 대사(이름 + 대사) 때 (main.js showFoeIntro · showFoeLine) */
      #foeIntro { position: fixed; z-index: 2; left: 50%; top: calc(46% + var(--fs-display) / 2 + 12px); transform: translateX(-50%); width: max-content; max-width: min(60vw, 520px); text-align: center; pointer-events: none; opacity: 0; transition: opacity .3s; text-shadow: var(--hud-outline); font-size: var(--fs-m); line-height: var(--lh-tight); word-break: keep-all; }
      #foeIntro.show { opacity: 1; transition-duration: .3s; }
      #foeIntro b { font-weight: var(--fw-head); color: var(--c-text); }
      #foeIntro i { font-style: normal; font-weight: var(--fw-body); color: var(--c-sub); margin-left: .45em; }
      #foeIntro i:empty { display: none; }
      #foeIntro span { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; margin-top: 4px; font-weight: var(--fw-body); color: var(--c-sub); }
      #foeIntro span:empty { display: none; }
      /* 대사 출처 (10/14 사장님 '출처까지 다 나오게 해' — 병마용의 고전 인용 『사기』·『설원』): 대사 아래 줄에 작게(--fs-s 12) · 보조 색 · 400. 출처 없는 인물은 빈칸이라 줄이 없다 (main.js lineSourceOf) */
      #foeIntro small { display: block; margin-top: 2px; font-size: var(--fs-s); font-weight: var(--fw-body); color: var(--c-sub); }
      #foeIntro small:empty { display: none; }
      @media (orientation: portrait) { #foeIntro { max-width: calc(100vw - 2 * var(--safe-l)); } }
      /* 왼쪽 위 (10/14 사장님 '왼쪽 상단에는 스테이지 번호와 스테이지 이름'): 오른쪽 위 칸과 거울. 첫 줄 .stg = '스테이지 N · 무대 이름'.
         무기 카드를 고르는 동안만 그 아래 em = 카드 안내 '무기 카드를 한 장 고르세요' (10/14 03:3x 사장님 '이전처럼 복구' — 00:4x 에 뺐던 #foeIntro em 의
         자리(칸 마지막 줄, 위 6px)·꼴 그대로: --fw-label · --ls-label · 강조 색. 크기는 칸 전체 작게 --fs-s (10/14 글자 규칙 §16). 카드를 고르면 .off 로 숨고 자리는 둔다 — main.js setDrawGuide).
         둘째 줄 'AI 이름 · 자세 / 기술'(.foe)은 10/14 03:3x 사장님 'AI 이름·기술명 표기는 아예 없앤다'로 걷어냈다. 카드 줄은 이 칸 아래에서 시작한다 (main.js layoutDraw) */
      #stageInfo { position: fixed; z-index: 2; left: var(--safe-l); top: var(--safe-t); width: var(--side-w); text-align: left; pointer-events: none; opacity: 0; transition: opacity .3s; text-shadow: var(--hud-outline); font-size: var(--fs-s); font-weight: var(--fw-head); line-height: var(--lh-tight); word-break: keep-all; }
      #stageInfo.show { opacity: 1; }
      #stageInfo .stg { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; }
      #stageInfo .stg { color: var(--c-text); }
      #stageInfo em { display: block; margin-top: 6px; font-size: var(--fs-s); font-style: normal; font-weight: var(--fw-label); letter-spacing: var(--ls-label); color: var(--c-accent); word-break: keep-all; }
      #stageInfo em:empty { display: none; }
      #stageInfo em.off { visibility: hidden; }

      /* ── 무기 뽑기: 판이 열리면 엎어 둔 카드 세 장. 왼쪽 두 장은 내가 고르는 카드, 맨 오른쪽은 상대 무기 칸(회색, 못 고른다) →
         내 카드를 누르면 뒤집혀 이번 판 무기가 나오고, 남은 내 카드가 어둡게 뒤집힌 뒤 상대 카드가 뒤집혀 상대 무기를 보여 준다 (main.js 무기 뽑기) ──
         카드 크기(--cw, --ch)와 자리(--top · --padT · --padL)는 판이 열릴 때·화면 상자가 바뀔 때 main.js 가 정한다. 움직임은 CSS 변환만 쓴다 */
      #draw { position: fixed; inset: 0; z-index: 1; display: none; --top: 150px; --padT: 0px; --padL: 0px; --cw: 200px; --ch: 290px; --gap: 14px; --kb: 10px; } /* 카드 글자 크기는 글자 규칙 세 단계 안 (10/14 §16 — 이름 보통 · 그 밖 작게, 큰 카드는 이름·설명만 한 단계 위 #draw.wide) */
      #draw.show { display: block; }
      #draw::before { content: ''; position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 62%, rgba(16,10,6,.62), rgba(16,10,6,.28) 72%); animation: drawFade .35s ease-out backwards; transition: opacity .4s; }
      #draw.fly::before { opacity: 0; }
      .drawRow { position: absolute; top: var(--top); bottom: max(8px, env(safe-area-inset-bottom)); left: max(16px, env(safe-area-inset-left)); right: max(16px, env(safe-area-inset-right)); display: flex; align-items: flex-start; justify-content: flex-start; padding: var(--padT) 0 0 var(--padL); gap: var(--gap); } /* 카드 자리(--padT · --padL, 정수 px)는 main.js layoutDraw 가 정한다 */
      .wcard { position: relative; flex: none; width: var(--cw); height: var(--ch); padding: 0; margin: 0; border: 0; background: none; color: inherit; font: inherit; perspective: 900px; cursor: pointer; touch-action: manipulation; outline: none;
        transition: transform .45s cubic-bezier(.2,.8,.3,1), opacity .4s, translate .15s; animation: dealIn .42s cubic-bezier(.2,.8,.3,1) backwards; }
      .wcard:nth-child(2) { animation-delay: .07s; }
      .wcard:nth-child(3) { animation-delay: .14s; }
      .wcardInner { position: absolute; inset: 0; transform-style: preserve-3d; -webkit-transform-style: preserve-3d; transition: transform .45s cubic-bezier(.35,.1,.25,1); }
      .wcard.flipped .wcardInner { transform: rotateY(180deg); }
      .wback, .wface { position: absolute; inset: 0; border-radius: 10px; overflow: hidden; backface-visibility: hidden; -webkit-backface-visibility: hidden; }
      /* 뒷면: 어떤 뒷면인지는 main.js 의 CARD_BACK_DEFAULT (주소 ?back=) 가 정하고 #draw 에 data-back 을 적어 둔다.
         그림 파일 뒷면(public/ui/cardbacks/<id>)은 --backImg 로 깔고, 까는 법·바탕색은 #draw[data-back="<id>"] 에 --backSize·--backBg 로 적는다 */
      .wback { border: 1px solid rgba(217,164,65,.6); background-color: var(--backBg, #1c130c); background-image: var(--backImg, none);
        background-position: center; background-repeat: no-repeat; background-size: var(--backSize, 100% 100%);
        box-shadow: 0 8px 20px rgba(0,0,0,.5); }
      /* 기본(classic): 가죽 빛 바탕에 금빛 안쪽 테두리와 가운데 마름모 칼 문장 (그림 파일 없이 CSS + main.js 의 작은 SVG).
         오너가 게임의 픽셀 결에 맞춘 새 뒷면을 고를 때까지 쓴다 (외형 PM 작업 중) */
      #draw[data-back="classic"] .wback { background: radial-gradient(circle at 50% 50%, rgba(217,164,65,.2), rgba(217,164,65,0) 58%),
          repeating-linear-gradient(45deg, rgba(255,240,210,.035) 0 2px, transparent 2px 10px),
          repeating-linear-gradient(-45deg, rgba(255,240,210,.035) 0 2px, transparent 2px 10px),
          linear-gradient(160deg, #3d2a1b, #1c130c);
        box-shadow: 0 8px 20px rgba(0,0,0,.5), inset 0 0 0 5px rgba(28,19,12,.9), inset 0 0 0 6px rgba(217,164,65,.42); }
      .wback svg { position: absolute; left: 50%; top: 50%; width: min(44%, 84px); height: auto; transform: translate(-50%, -50%); }
      /* 픽셀 뒷면 (오너 결정, 외형 PM v3 · docs/design_language.md): 조각 그림을 한 칸 = --px 로 정수 배 확대해 붙인다.
         조각 주소와 바탕색은 main.js setCardBack 이 카드마다 --b-* 로 넣는다 (상대 칸은 회색 조각). 모서리는 픽셀 결대로 네모 */
      #draw[data-back="px"] .wback { border: 0 solid transparent; border-radius: 0; box-shadow: 0 8px 20px rgba(0,0,0,.5);
        border-image: var(--b-frame) 7 / calc(7 * var(--px)) / 0 repeat;
        background: var(--b-center) center / calc(14 * var(--px)) no-repeat,
          var(--b-plaque) center bottom calc(3 * var(--px)) / calc(10 * var(--px)) no-repeat,
          var(--b-plaque) center top calc(3 * var(--px)) / calc(10 * var(--px)) no-repeat,
          var(--b-tile) center / calc(16 * var(--px)) calc(32 * var(--px)) repeat,
          var(--b-bg);
        background-blend-mode: normal; image-rendering: pixelated; image-rendering: crisp-edges; }
      /* 번호 배지 (PC: 누를 키 1·2 — 누를 것이라 강조 색). 뒷면 그림 아래쪽 홈에 맞춰 main.js 가 --kb 로 높이를 정한다 */
      .wback .wkey { position: absolute; left: 50%; bottom: var(--kb); transform: translateX(-50%); min-width: 22px; height: 22px; padding: 0 6px; border-radius: 11px; border: 1px solid rgba(217,164,65,.7); background: rgba(20,13,8,.72); color: var(--c-accent); font-size: var(--fs-s); font-weight: var(--fw-label); line-height: 20px; text-align: center; white-space: nowrap; }
      body.touch .wback .wkey:not(.wfoe) { display: none; }
      /* 상대 무기 칸 (맨 오른쪽): 모양은 같고 회색으로 어둡게, 번호 대신 "상대" (폰에서도 보인다). 누를 수 없다 (살짝 흔들릴 뿐).
         회색은 filter 대신 배경 섞기(color)로 만든다: 뒤집히는 카드에 filter 를 걸면 사파리에서 뒷면 숨기기가 풀릴 수 있다 */
      .wcard.foe { cursor: default; }
      .wcard.foe .wback { border-color: rgba(200,194,182,.42);
        background-image: linear-gradient(rgba(8,6,5,.44), rgba(8,6,5,.44)), linear-gradient(#808080, #808080), var(--backImg, none);
        background-size: 100% 100%, 100% 100%, var(--backSize, 100% 100%); background-blend-mode: normal, color, normal; }
      #draw[data-back="classic"] .wcard.foe .wback {
        background: linear-gradient(rgba(8,6,5,.44), rgba(8,6,5,.44)), linear-gradient(#808080, #808080),
          repeating-linear-gradient(45deg, rgba(255,240,210,.035) 0 2px, transparent 2px 10px),
          repeating-linear-gradient(-45deg, rgba(255,240,210,.035) 0 2px, transparent 2px 10px),
          linear-gradient(160deg, #3d2a1b, #1c130c);
        background-blend-mode: normal, color, normal, normal, normal;
        box-shadow: 0 8px 20px rgba(0,0,0,.5), inset 0 0 0 5px rgba(8,6,5,.9), inset 0 0 0 6px rgba(200,194,182,.28); }
      /* "상대" 배지: 붉은 빛 없이 글자만 희게 (오너 결정 — 붉으면 너무 튄다, 회색 글자는 안 읽힌다) */
      .wback .wkey.wfoe { border-color: rgba(236,232,225,.45); background: rgba(12,10,9,.7); color: var(--c-text); font-size: var(--fs-s); letter-spacing: var(--ls-label); padding: 0 9px 0 10px; }
      .wcard.nope .wcardInner { animation: nope .3s ease-in-out; }
      /* 앞면: 작은 그림 · 이름(등급 색) · 등급 · 설명 */
      .wface { transform: rotateY(180deg); display: flex; flex-direction: column; align-items: center; padding: 8px 9px 10px; text-align: center;
        border: 1px solid var(--tc); background: linear-gradient(172deg, #30241a, #17110c 70%); box-shadow: 0 8px 20px rgba(0,0,0,.5), inset 0 0 0 1px rgba(0,0,0,.6); }
      /* 누구 무기인지: 고른 카드 "내 무기"(금빛), 상대 카드 "상대 무기"(검붉은 빛). 못 고른 카드에는 없다 */
      .wwho { display: none; flex: none; font-size: var(--fs-s); font-weight: var(--fw-label); letter-spacing: var(--ls-label); line-height: 1; padding: 3px 8px 2px 9px; border-radius: 999px; margin-bottom: 1px; color: var(--c-on-accent); background: var(--c-accent); }
      .wcard.picked .wwho, .wcard.foe .wwho { display: block; }
      .wcard.foe .wwho { color: var(--c-text); background: #93372d; } /* '상대 무기': 본문 색 글자 on 상대 색 계열의 짙은 바탕 */
      .wthumb { flex: 1 1 auto; min-height: var(--thumbMin, 36px); width: 100%; background-position: center; background-repeat: no-repeat; background-size: contain, 100% 100%; filter: drop-shadow(0 2px 3px rgba(0,0,0,.55)); }
      .wname { display: block; font-size: var(--fs-m); font-weight: var(--fw-head); line-height: var(--lh-tight); color: var(--tc); text-shadow: 0 0 10px var(--tg), 0 1px 1px #000; margin-top: 2px; word-break: keep-all; }
      .wsub { display: block; font-size: var(--fs-s); line-height: var(--lh-tight); color: var(--c-sub); word-break: keep-all; }
      .wsub:empty { display: none; }
      .wtier { display: inline-block; font-size: var(--fs-s); font-weight: var(--fw-label); letter-spacing: var(--ls-label); line-height: 1; color: var(--tc); border: 1px solid var(--tc); border-radius: 999px; padding: 3px 8px 2px 9px; margin: 4px 0; opacity: .9; }
      /* 설명: 두 줄 글을 이어서 흘려 쓰고 줄 길이를 고르게 맞춘다 (카드 폭이 화면마다 달라 줄을 억지로 꺾으면 한두 글자만 남은 줄이 생긴다) */
      .wdesc { display: block; margin: 0; font-size: var(--fs-s); line-height: var(--lh-text); color: var(--c-text); word-break: keep-all; text-wrap: balance; }
      .wabil { display: block; margin: 2px 0 0; font-size: var(--fs-s); line-height: var(--lh-text); color: var(--tc); word-break: keep-all; text-wrap: balance; } .wabil:empty { display: none; } /* 에픽 특수 능력 한 줄 */
      /* 큰 카드(#draw.wide — 폭 205 · 높이 260 이상, PC 1280×720 의 224×344 등 · main.js layoutDraw): 이름과 설명만 한 단계 위(이름 크게 · 설명·특수 능력 보통).
         같은 세 단계 안에서 — 사장님 10/14 03:1x 'PC 는 폰보다 크게(그때 15px)'의 뜻을 규칙으로. 부제·등급·알약은 작게 그대로 */
      #draw.wide .wname { font-size: var(--fs-l); }
      #draw.wide .wdesc, #draw.wide .wabil { font-size: var(--fs-m); }
      #draw.wide .wtier { margin: 6px 0; }
      #draw.low .wface { padding: 6px 7px 7px; }
      #draw.low .wthumb { min-height: var(--thumbMin, 28px); } /* --thumbMin: 폭을 다 넓혀도 설명이 넘치는 아주 작은 가로 화면에서만 main.js layoutDraw 가 줄인다 (설명은 처음부터 가장 작은 단계 --fs-s 라 더 줄이지 않는다) */
      #draw.low .wtier { margin: 2px 0; }
      /* 고른 카드: 살짝 들리고 금빛 테두리. 못 고른 카드: 작아지고 어둡게 (무엇을 놓쳤는지는 보인다) */
      .wcard.picked { transform: translateY(-1%) scale(1.03); z-index: 1; }
      .wcard.picked .wface { box-shadow: 0 0 0 2px var(--c-accent), 0 10px 26px rgba(0,0,0,.55), 0 0 24px var(--tg); }
      .wcard.missed { transform: scale(.92); }
      .wcard.missed .wface::after { content: ''; position: absolute; inset: 0; background: rgba(14,9,6,.36); }
      .wcard.missed .wthumb { filter: grayscale(.7); }
      /* 상대 카드가 뒤집히면 제 색으로: 검붉은 테두리 (내 카드의 금빛 테두리와 짝) */
      .wcard.foe.flipped .wface { box-shadow: 0 0 0 2px var(--foe), 0 10px 26px rgba(0,0,0,.55), 0 0 24px var(--tg); }
      /* 진짜 엑스칼리버: 앞면이 보이면 금빛으로 일렁인다 (빛 층의 불투명도만 움직인다) */
      .wcard.grand::before { content: ''; position: absolute; inset: 0; border-radius: 10px; box-shadow: 0 0 30px 8px rgba(255,205,70,.75), 0 0 8px 2px rgba(255,236,160,.9); opacity: 0; transition: opacity .3s .2s; pointer-events: none; }
      .wcard.grand.flipped::before { opacity: 1; animation: grandPulse 1.1s .5s ease-in-out infinite alternate; }
      .wcard.grand.missed::before { opacity: .35; animation: none; }
      @media (hover: hover) {
        #draw.choose .wcard:not(.foe):hover { translate: 0 -5px; }
        #draw.choose .wcard:not(.foe):hover .wback { border-color: #f0c768; }
      }
      .wcard:focus-visible .wback { border-color: #f0c768; box-shadow: 0 0 0 2px #f0c768, 0 8px 20px rgba(0,0,0,.5); }
      /* 사라지기: 고른 카드는 내 캐릭터 쪽(아래)으로, 상대 카드는 상대 쪽(위)으로 작아지며, 못 고른 카드는 위로 흩어지며 */
      #draw.fly .wcard { opacity: 0; transition: transform .45s cubic-bezier(.5,0,.8,.4), opacity .4s ease-in; }
      #draw.fly .wcard.picked { transform: translateY(40%) scale(.5); }
      #draw.fly .wcard.missed { transform: translateY(-14%) scale(.8); }
      #draw.fly .wcard.foe { transform: translateY(-22%) scale(.55); }
      @keyframes dealIn { from { transform: translateY(26px) scale(.88); opacity: 0; } }
      @keyframes nope { 20% { translate: -5px 0; } 45% { translate: 4px 0; } 70% { translate: -2px 0; } }
      @keyframes drawFade { from { opacity: 0; } }
      @keyframes grandPulse { from { opacity: .55; } to { opacity: 1; } }

      /* 터치 이동 조이스틱 (싸우는 동안) */
      #moveStick { position: fixed; left: max(20px, env(safe-area-inset-left)); bottom: max(20px, env(safe-area-inset-bottom)); width: 110px; height: 110px; border-radius: 50%; border: 1px solid var(--line); background: rgba(24, 18, 14, 0.45); display: none; touch-action: none; }
      #moveStick.show { display: block; }
      /* 막기 단추 (10/11 — 누르고 있는 동안 유파 막기 자세, src/parry_button.js): 오른쪽 아래, 조이스틱과 마주 보는 자리 · 같은 바탕·테두리. 오른 엄지가 칼 끌기와 오가며 닿는다.
         누르는 동안 밝게 (.on). 아래 가운데 알림 줄(#emoMsg · #hint)과 오른쪽 위 칸에 닿지 않는다 */
      #btnParry { position: fixed; right: max(20px, env(safe-area-inset-right)); bottom: max(20px, env(safe-area-inset-bottom)); width: 84px; height: 84px; border-radius: 50%; border: 1px solid var(--line); background: rgba(24, 18, 14, 0.45); color: var(--c-text); font-family: inherit; font-size: var(--fs-m); font-weight: var(--fw-head); letter-spacing: var(--ls-label); text-shadow: var(--hud-outline); display: none; touch-action: none; padding: 0; }
      #btnParry.show { display: block; }
      #btnParry.on { background: rgba(243, 230, 200, 0.32); border-color: var(--c-text); }
      #moveKnob { position: absolute; left: 50%; top: 50%; width: 48px; height: 48px; margin: -24px 0 0 -24px; border-radius: 50%; background: var(--panel); border: 1px solid var(--line); pointer-events: none; }

      /* 메뉴 */
      .overlay { position: fixed; inset: 0; z-index: 3; display: none; align-items: center; justify-content: center; padding: 16px; background: radial-gradient(ellipse at center, rgba(27,20,16,.55), rgba(27,20,16,.92)); }
      .overlay.show { display: flex; }
      .card { width: min(340px, 100%); max-height: 100%; overflow-y: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 20px; touch-action: pan-y; }
      /* 창 (시작·일시정지·결과 — 10/14 글자 규칙 §16): 제목 크게 · 부제·줄·단추 보통 · 고르개·안내 작게 */
      h1 { margin: 0 0 4px; font-size: var(--fs-l); font-weight: var(--fw-head); line-height: var(--lh-tight); letter-spacing: var(--ls-label); }
      h2 { margin: 0 0 12px; font-size: var(--fs-l); font-weight: var(--fw-label); }
      /* 큰 영문 제목 (첫 메뉴의 'Stillness' — 10/14 웹폰트 3안): 라틴 글자라 Cinzel 로 그린다(글꼴 줄 --font-ui). 크기는 큰 글자 예외 --fs-wordmark, 굵기는 h1 그대로(--fw-head — 3안의 800 에서 한 단계).
         일시정지·승리·패배로 제목 글을 바꾸면 이 칸이 사라져 h1 그대로(크게 --fs-l) */
      .wordmark { display: block; font-size: var(--fs-wordmark); line-height: 1.1; }
      .sub { color: var(--c-sub); font-size: var(--fs-m); margin: 0 0 14px; line-height: var(--lh-text); }
      #menuSub small { display: block; margin-top: 2px; font-size: var(--fs-s); font-weight: var(--fw-body); color: var(--c-sub); } /* 결과 창 부제의 대사 출처 (병마용 — 위 #foeIntro small 과 같은 꼴) */
      .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 42px; padding: 4px 0; border-top: 1px solid var(--line); font-size: var(--fs-m); }
      .seg { display: flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
      .seg button { background: transparent; color: var(--c-sub); border: 0; padding: 6px 10px; font-size: var(--fs-s); }
      .seg button.on { background: var(--c-accent); color: var(--c-on-accent); font-weight: var(--fw-label); }
      .toggle { width: 44px; height: 24px; border-radius: 12px; border: 1px solid var(--line); background: rgba(0,0,0,.4); position: relative; }
      .toggle::after { content: ''; position: absolute; top: 2px; left: 2px; width: 18px; height: 18px; border-radius: 50%; background: var(--c-sub); transition: left .15s; }
      .toggle.on { background: var(--c-accent); }
      .toggle.on::after { left: 22px; background: #1b1410; }
      .primary { width: 100%; margin-top: 14px; padding: 13px; font-size: var(--fs-m); font-weight: var(--fw-head); border: 0; border-radius: 8px; background: var(--c-accent); color: var(--c-on-accent); }
      .secondary { width: 100%; margin-top: 8px; padding: 11px; font-size: var(--fs-m); border: 1px solid var(--line); border-radius: 8px; background: transparent; color: var(--c-text); }
      .actions { position: sticky; bottom: -20px; margin: 0 -20px -20px; padding: 0 20px 20px; background: var(--panel); }
      .howto { font-size: var(--fs-s); color: var(--c-sub); line-height: 1.6; margin: 12px 0 0; padding-left: 18px; }
      .minor { color: var(--c-accent); font-size: var(--fs-s); margin-left: 6px; }
      .actions + .howto { margin-top: 28px; } /* 단추 줄(.actions)의 아래 여백 -20px 만큼 끌려 올라가 첫 줄이 단추 줄 바탕 밑에 가리던 것 (10/10 20:3x 창 정리 때 고침) */

      /* 설정 창 (시작·일시정지·결과가 함께 쓰는 #menu): 남은 설정이 하나(60 fps 제한 — 상대 난이도는 10/13 에 뺐다)라 한 열 · 좁은 폭 (10/10 20:3x 사장님 '2열로 넓을 필요가 없어졌어' — §14).
         폭은 위 .card (460 → 340px). 테스트 경로(test=1)가 붙이는 '테스트 고르기로' 단추(.secondary 100%)·안내 한 줄도 이 폭을 따른다 */
      /* 가로로 든 폰처럼 낮은 화면: 글자는 줄이지 않고 여백만 촘촘하게 (한 열 그대로) */
      @media (max-height: 500px) {
        .card { padding: 12px 18px; }
        .sub { margin-bottom: 8px; }
        .row { min-height: 36px; padding: 2px 0; }
        .primary { margin-top: 10px; padding: 10px; }
        .secondary { padding: 8px; }
        .howto { display: none; }
        .actions { bottom: -12px; margin: 0 -18px -12px; padding: 0 18px 12px; }
      }
      #rotate { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; text-align: center; background: #1b1410; font-size: var(--fs-l); line-height: var(--lh-text); padding: 24px; z-index: 10; }
      @media (orientation: portrait) and (pointer: coarse) { #rotate.enabled { display: flex; } }
    </style>
  </head>
  <body>
    <canvas id="game"></canvas>

    <!-- 체력 게이지 없음: 피를 흘리거나 아프면 화면 가장자리가 붉게 물든다 -->
    <div id="hud"><div id="vignette"></div><div id="emotion"></div></div>
    <div id="topButtons">
      <button class="iconBtn" id="btnPause" aria-label="일시정지">Ⅱ</button>
    </div>
    <div id="toast"></div>
    <div id="emoMsg"></div>
    <div id="hint"></div>
    <div id="foeIntro"><b></b><i></i><span></span><small></small></div>
    <div id="stageInfo" aria-live="polite"><div class="stg"></div><em></em></div>
    <!-- 무기 뽑기 카드 세 장 (main.js 가 판마다 채운다. 단추 안이라 span 만 쓴다).
         왼쪽 두 장은 내가 고르는 카드(단추), 맨 오른쪽은 상대 무기 칸이라 누를 수도 초점을 받을 수도 없다(단추가 아니다) -->
    <div id="draw">
      <div class="drawRow">
        <button class="wcard" data-i="0"><span class="wcardInner"><span class="wback"></span><span class="wface"><small class="wwho">내 무기</small><span class="wthumb"></span><b class="wname"></b><small class="wsub"></small><span class="wtier"></span><span class="wdesc"></span><span class="wabil"></span></span></span></button>
        <button class="wcard" data-i="1"><span class="wcardInner"><span class="wback"></span><span class="wface"><small class="wwho">내 무기</small><span class="wthumb"></span><b class="wname"></b><small class="wsub"></small><span class="wtier"></span><span class="wdesc"></span><span class="wabil"></span></span></span></button>
        <div class="wcard foe" data-i="2" role="img"><span class="wcardInner"><span class="wback"></span><span class="wface"><small class="wwho">상대 무기</small><span class="wthumb"></span><b class="wname"></b><small class="wsub"></small><span class="wtier"></span><span class="wdesc"></span><span class="wabil"></span></span></span></div>
      </div>
    </div>
    <!-- 오른쪽 위 두 묶음: ① 자세 · (#techCue 안) ② 패시브·비기 — 둘 다 줄 하나 (10/10 20:3x, §14) -->
    <div id="guardName" class="slot"></div>
    <div id="staminaHud"></div>
    <div id="techCue"><div id="techSlot" class="stack" aria-live="polite"><div class="slot"></div></div></div>
    <div id="moveStick" aria-label="이동 조이스틱"><div id="moveKnob"></div></div>
    <button id="btnParry" aria-label="막기 (누르고 있기)">막기</button>

    <div class="overlay show" id="menu">
      <div class="card">
        <h1 id="menuTitle"><span class="wordmark">Stillness</span></h1>
        <p class="sub" id="menuSub">길 위에선 이름을 묻지 않는다.</p>
        <!-- 상대 난이도 줄은 뺐다 (사장님 결정 10/13 '상대 난이도는 메뉴에서 빼자' — 상대의 실력은 인물 숙련도가 정한다, characters.js · main.js) -->
        <!-- 검술 보정 단계 메뉴(끔·약·보통·강)는 뺐다 — 사장님 10/8 21:5x "플레이어에겐 구분이 필요 없어. 한 단계로 기본 적용": 보정은 늘 0.7 (main.js DEFAULTS.skill) -->
        <!-- 10/10 19:2x 사장님 '시작 전 설정에서도 뺄 기능이 많아': 자세 이름 · 피 · 조작 흔적 · 유파 기술 알림 · 소리 · 비기 화면 번쩍임 · 비기 카메라 연출은 늘 켬,
             픽셀 모드(실험 ?pixel=1)는 주소 인자로만, 기울기 이동은 기능째 지웠다 (main.js DEFAULTS). 모든 기술 이름(디버그 ?techCueAll=1)은 10/14 03:3x 상대 기술 표기와 함께 걷어냈다 -->
        <div class="row"><span>화면 60 fps 제한</span><button class="toggle" data-setting="fpsCap" aria-label="화면 60 fps 제한"></button></div>
        <!-- 시작 단추는 카드 아래에 붙여 둔다: 가로로 든 폰에서 설정 목록이 길어도 스크롤 없이 보인다 -->
        <div class="actions">
          <button class="primary" id="btnStart">여정 시작</button> <!-- 사장님 10/14 11:0x "싸움 시작 문구는 유치해. 여정 시작" -->
          <button class="secondary" id="btnResume" style="display:none">계속하기</button>
        </div>
        <ul class="howto" id="howto"></ul>
      </div>
    </div>

    <div id="rotate">📱↻<br />폰을 가로로 돌려 주세요</div>

    <script type="module" src="/src/main.js"></script>
    <script type="module" src="/src/pwa.js"></script>
  </body>
</html>
