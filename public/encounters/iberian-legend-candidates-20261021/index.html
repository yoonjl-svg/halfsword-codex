<main><header><h1>이베리아의 세 전설</h1><p>레전드 무기 후보 · 양손검 외형 시안<br>그림을 누르면 투명 배경 원본이 열립니다.</p></header>
<section class="cards" aria-label="세 무기 비교">
<article><div class="tag">A · 부서지지 않는 성검</div><a href="durandal-original.png" aria-label="뒤랑달 원본 크게 보기"><div class="image"><img src="durandal-original.png" width="1254" height="1254" alt="넓은 은회색 날, 붉은 감개, 금빛 십자 코등이와 성물함 끝장식의 뒤랑달"></div><h2>뒤랑달</h2></a><p>붉은 감개 · 묵직한 십자 코등이<br>오래된 성물함을 품은 검</p></article>
<article><div class="tag">B · 엘 시드의 이름</div><a href="tizona-original.png" aria-label="티소나 원본 크게 보기"><div class="image"><img src="tizona-original.png" width="1254" height="1254" alt="어두운 날과 금빛 각인, 상아색 감개, 휘어진 검은 코등이의 티소나"></div><h2>티소나</h2></a><p>검은 철 · 상아색 감개<br>칼날에 남은 잿불빛 각인</p></article>
<article><div class="tag">C · 금과 수정의 검</div><a href="hauteclere-original.png" aria-label="오트클레르 원본 크게 보기"><div class="image"><img src="hauteclere-original.png" width="1254" height="1254" alt="밝은 은빛 날, 청록 감개, 옅은 금빛 코등이와 투명 수정 끝장식의 오트클레르"></div><h2>오트클레르</h2></a><p>밝은 강철 · 정돈된 금장<br>투명한 수정으로 맺은 끝장식</p></article>
