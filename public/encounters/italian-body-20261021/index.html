<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Stillness · 막아찌르기 몸꼴 비교</title><style>
@font-face{font-family:Stillness;src:url(game/fonts/Pretendard-Regular.subset.woff2)}*{box-sizing:border-box}html,body{margin:0;height:100%;background:#1e1d19;color:#dbd0b7;font-family:Stillness,serif}body{display:flex;flex-direction:column}header{display:flex;align-items:center;gap:8px;padding:6px max(10px,env(safe-area-inset-right));border-bottom:1px solid #796c4f;font-size:12px}button,select{font:inherit;color:#e5d9bc;background:#333027;border:1px solid #918164;padding:8px 10px;border-radius:0;cursor:pointer}button:focus,select:focus{outline:2px solid #d6ad65}#mode{max-width:195px}#status{flex:1;min-width:0;color:#b8b09f;font-size:11px}iframe{border:0;width:100%;flex:1;min-height:0;background:#171713}dialog{width:min(560px,94vw);max-height:94dvh;overflow:auto;background:#25231e;color:#dbd0b7;border:2px solid #958363;padding:22px}dialog::backdrop{background:#111e}h1{font-size:22px;font-weight:normal;margin:0 0 12px}p{font-size:13px;line-height:1.6;color:#c1b8a4}label{display:grid;grid-template-columns:90px 1fr;align-items:center;gap:10px;margin:10px 0;font-size:14px}label select{width:100%;min-width:0}footer{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}small{font-size:11px;color:#aaa18e}@media(max-height:470px){dialog{padding:13px;width:640px}h1{font-size:18px;margin-bottom:6px}label{margin:6px 0}p{margin:5px 0;font-size:12px;line-height:1.4}footer{margin-top:8px}}@media(max-width:500px){header{flex-wrap:wrap}#status{flex-basis:100%}}
</style></head><body><header>
<select id="mode" aria-label="비교 조합"><option value="body">새 몸꼴 · 받으며 뻗기</option><option value="baseline">기존 몸꼴 · C 조합</option></select><button id="restart">다시 시작</button><span id="status">연습 조건을 골라 주세요.</span><button id="settings">연습 설정</button></header>
<iframe id="game" title="Stillness 레이피어 막아찌르기 시험" allow="autoplay; fullscreen 'none'"></iframe>
<dialog id="options"><h1>레이피어 · 막아찌르기</h1><p>같은 C 조합에서 몸꼴만 비교합니다. 새 몸꼴은 칼쪽 어깨와 몸통을 함께 뻗습니다. 두 안 모두 흘림과 같은 불꽃·마찰음·진동으로 발동을 알립니다. 휴대폰은 가로로 돌려 주세요.</p>
<label>내 역할<select id="role"><option value="defender">방어자 · 레이피어로 막아찌르기</option><option value="attacker">공격자 · 롱소드로 막아찌르기 상대하기</option></select></label>
<label>일회 충격<select id="impulse"><option value="1">켬 · 기본 조건</option><option value="0">끔 · 충격 효과만 비교</option></select></label>
<p id="hint"></p><p id="values"></p><small>공격자 연습의 상대는 같은 막기 버튼 규칙으로 반응하는 연습용 방어자입니다. 발동 성공률은 실제 접촉과 방어 상태에 따릅니다. 자동 전진·상대 팔힘 감소는 없습니다. 시험 기록은 탭 안에만 남습니다.</small>
<footer><button id="close">돌아가기</button><button id="start">이 조건으로 시작</button></footer></dialog><script>
const $=id=>document.getElementById(id),q=new URLSearchParams(location.search);let running=false;
for(const id of ['mode','role','impulse'])if([...$(id).options].some(o=>o.value===q.get(id)))$(id).value=q.get(id);
const values={body:'새 몸꼴 · 어깨·몸통을 함께 뻗기',baseline:'기존 몸꼴 · 접촉 당시 몸통 자세 유지'};
function hint(){$('hint').textContent=$('role').value==='attacker'?'상대에게 베거나 찔러 보세요. 칼이 밀리고, 상대의 찌르기가 함께 나오는 순간을 비교해 주세요.':'브론은 사인검을 사용합니다. 막기를 누른 뒤의 시간 제한은 없습니다. 칼끝 방향·거리·공격 시간 때문에 접촉을 제외하지 않도록 완화했습니다. 막기를 누르고 사인검을 받아 보세요. 한 번 발동한 뒤에는 놓았다가 다시 누르면 다음 발동을 준비합니다. 찌르기가 끝나기 전에 놓으면 동작이 중단됩니다. 성공 후 직접 반격도 해 보세요.';$('values').textContent=values[$('mode').value]+' · C 손길과 일회 충격은 동일';}
function start(){const role=$('role').value,mode=$('mode').value,impulse=$('impulse').value;history.replaceState(null,'',`?mode=${mode}&role=${role}&impulse=${impulse}`);const a=new URLSearchParams({test:'1',weapon:role==='defender'?'rapier':'longsword',foeWeapon:role==='defender'?'sain':'rapier',foe:'bran',stage:'poseidon',uniqueStage:'2',slowMo:'0',rev:'body-cue1',role,mode,impulse});$('game').src='game/index.html?'+a;running=true;$('options').close();$('status').textContent='불러오는 중…';}
$('role').onchange=hint;hint();$('options').showModal();$('settings').onclick=()=>{$('options').showModal();$('game').contentWindow?.postMessage({type:'lab-pause'},location.origin);};$('close').onclick=()=>{if(running)$('options').close();};$('start').onclick=start;$('restart').onclick=()=>running?start():$('options').showModal();$('mode').onchange=()=>{hint();if(running)start();};
window.addEventListener('message',e=>{if(e.origin!==location.origin||e.source!==$('game').contentWindow||e.data?.type!=='stillness-rapier-lab')return;const s=e.data;$('status').textContent=`몸꼴 비교 · ${s.role==='defender'?'내':'상대'} 막아찌르기 ${s.starts}회 · 충격 ${s.beats}회${s.active?' · 발동 중':''}${s.gameState==='menu'?' · 게임 시작을 눌러 주세요.':''}`;});
</script></body></html>
