<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc">
<title id="title">청람잔도 구도 개념도 — 실제 게임 화면 아님</title>
<desc id="desc">맑고 화창한 정오의 하늘 아래 겹쳐지는 남중국풍 석회암 봉우리. 맞은편 천연 돌다리의 구멍 너머로 옥빛 강이 굽어 흐릅니다. 가까운 바위 쉼터에 삿갓 쓴 작은 여행자가 서 있고, 오른쪽에는 암벽과 구불구불한 잔도가 있습니다.</desc>
<defs>
 <linearGradient id="sky" x2="0" y2="1"><stop stop-color="#66b7dc"/><stop offset="1" stop-color="#d5eadd"/></linearGradient>
