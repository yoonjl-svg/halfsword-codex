<!doctype html>
<html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Stillness · 픽셀 재해석 비교</title>
<style>
@font-face{font-family:GameText;src:url('../../fonts/Pretendard-Regular.subset.woff2')}*{box-sizing:border-box}body{margin:0;background:#22201c;color:#dfd5c3;font-family:GameText,system-ui,sans-serif}main{max-width:1280px;margin:auto;padding:28px 20px 40px}h1{font-size:23px;font-weight:400;margin:0 0 10px}h2{font-size:18px;font-weight:400;margin:28px 0 12px}p,footer{font-size:13px;line-height:1.7;color:#b9ae9b}a{color:#d7bc80;text-underline-offset:3px}.modes{display:flex;flex-wrap:wrap;gap:8px;margin:20px 0}button{font:inherit;font-size:13px;color:inherit;background:#302b23;border:1px solid #786448;padding:9px 12px;cursor:pointer}button[aria-pressed=true]{background:#bda578;color:#201c16}button:focus-visible,a:focus-visible{outline:2px solid #eed7a9;outline-offset:3px}.compare{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}figure{margin:0;min-width:0}figure[hidden]{display:none}img{display:block;width:100%;height:auto;aspect-ratio:1;object-fit:contain}.pixel{image-rendering:pixelated}figcaption{font-size:14px;display:flex;justify-content:space-between;gap:6px;margin:9px 0}figcaption a{font-size:12px}body.single .compare{grid-template-columns:minmax(0,440px)}footer{margin-top:32px}.error{color:#e1bba1}@media(max-width:700px){main{padding:20px 12px}.compare{grid-template-columns:1fr;gap:18px}h1{font-size:21px}}
</style>
<main><h1>Stillness · 픽셀 재해석 비교</h1>
<p>랴오와 마야 · 원본 / 16배 목표 / 32배 목표<br>윤곽·표정·명암을 다시 그린 시안입니다. 배율은 목표값이며, 정확한 고정 격자와는 차이가 있습니다.</p>
<nav class="modes" aria-label="비교 보기"><button data-mode="all" aria-pressed="true">전체 비교</button><button data-mode="original" aria-pressed="false">원본</button><button data-mode="16" aria-pressed="false">16배 목표</button><button data-mode="32" aria-pressed="false">32배 목표</button></nav>
<div id="portraits"></div><p id="error" class="error" hidden>이미지를 불러오지 못했습니다. 잠시 후 새로고침해 주세요.</p>
<footer><a href="../pixel-profiles-alter-frame1-v2-20261017/">얼터 16명 수정 원본 보기</a><br>이번 샘플과 기존 고화질 원본은 각각 보존했습니다.</footer></main>
<script type="module">
let mode='all';
function filter(){document.body.classList.toggle('single',mode!=='all');document.querySelectorAll('figure').forEach(f=>f.hidden=mode!=='all'&&f.dataset.mode!==mode);document.querySelectorAll('button[data-mode]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.mode===mode)));}
document.querySelectorAll('button[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;filter();});
try{const r=await fetch('profiles.json');if(!r.ok)throw Error(r.status);const data=await r.json();for(const c of data.characters){const section=document.createElement('section'),title=document.createElement('h2'),grid=document.createElement('div');title.textContent=c.name;grid.className='compare';section.append(title,grid);for(const v of [{mode:'original',file:c.original,label:'원본'},...c.variants.map(v=>({mode:String(v.scale),file:v.file,label:v.scale+'배 목표'}))]){const f=document.createElement('figure'),img=new Image(),caption=document.createElement('figcaption'),label=document.createElement('span'),a=document.createElement('a');f.dataset.mode=v.mode;img.src=v.file;img.alt=c.name+' · '+v.label;img.width=1254;img.height=1254;if(v.mode!=='original')img.className='pixel';label.textContent=v.label;a.href=v.file;a.download=c.id+'-'+v.mode+'.png';a.textContent='저장';caption.append(label,a);f.append(img,caption);grid.append(f);}document.querySelector('#portraits').append(section);}filter();}catch(e){document.querySelector('#error').hidden=false;console.error(e);}
</script></html>
