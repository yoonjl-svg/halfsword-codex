<!doctype html>
<html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Stillness · 얼터 프로필 수정안</title><style>
@font-face{font-family:GameText;src:url('../../fonts/Pretendard-Regular.subset.woff2')}*{box-sizing:border-box}body{margin:0;background:#22201c;color:#dfd5c3;font-family:GameText,system-ui,sans-serif}main{max-width:1160px;margin:auto;padding:28px 16px 40px}h1{font-size:23px;font-weight:400;margin:0 0 10px}p,footer{font-size:13px;line-height:1.7;color:#b9ae9b}a{color:#d7bc80;text-underline-offset:3px}button{font:inherit;color:inherit;background:#302b23;border:1px solid #786448;border-radius:0;cursor:pointer;padding:10px 16px}button[aria-pressed=true]{background:#bda578;color:#201c16;border-color:#dbc18b}button:focus-visible,a:focus-visible{outline:2px solid #eed7a9;outline-offset:3px}.modes{display:flex;gap:8px;margin:18px 0 22px}.modes button{font-size:14px}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:22px 14px}.card{display:block;width:100%;padding:0;border:0;background:none;text-align:left}.card img{display:block;width:100%;height:auto;aspect-ratio:1;object-fit:contain}.low{image-rendering:pixelated}.name{display:block;margin-top:9px;font-size:15px}.epithet{display:block;margin-top:4px;color:#a99e8a;font-size:12px}.count{margin-left:auto;align-self:center;color:#a99e8a;font-size:12px}footer{margin-top:30px}dialog{padding:16px;border:1px solid #786448;color:inherit;background:#22201c;width:min(1080px,calc(100vw - 20px));max-height:calc(100dvh - 20px);overflow:auto}dialog::backdrop{background:#080705dd}.dialog-head{display:flex;align-items:center;gap:8px}.dialog-head h2{font-weight:400;font-size:17px;margin:0;flex:1}.dialog-head button{padding:9px 12px;font-size:13px}.compare{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:18px}figure{margin:0;min-width:0}figure img{display:block;width:100%;aspect-ratio:1;object-fit:contain}figcaption{display:flex;align-items:center;justify-content:space-between;gap:6px;font-size:13px;margin:9px 0}.pager{display:flex;justify-content:space-between;align-items:center;margin-top:18px;font-size:13px}.error{color:#e1bba1}@media(max-width:700px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.compare{grid-template-columns:1fr;gap:18px}main{padding:20px 12px}h1{font-size:21px}.dialog-head h2{font-size:15px}}
</style>
<main><h1>Stillness · 얼터 프로필 수정안</h1><p>얼굴 크기·방향·표정을 다듬은 고화질 원본<br>인물을 누르면 기본 모습과 이전 얼터를 함께 살펴볼 수 있습니다.</p>
<p><a href="../pixel-profiles-low128-20261017/">기본·얼터 전체의 새 low와 원본 보기</a></p>
<p id="count"></p><div class="grid" id="grid"></div><p id="error" class="error" hidden>프로필을 불러오지 못했습니다. 잠시 후 새로고침해 주세요.</p>
<footer><a href="../pixel-profiles-frame1-v1-20261017/">기본 캐릭터 프로필</a> · <a href="../pixel-profiles-alter-frame1-20261017/">이전 얼터</a><br>게임용 프로필 이미지 검토 페이지</footer></main>
<dialog id="detail" aria-labelledby="detail-name"><div class="dialog-head"><h2 id="detail-name"></h2><button id="close" aria-label="프로필 닫기">닫기</button></div>
<div class="compare"><figure><img id="base" alt=""><figcaption>기본</figcaption></figure><figure><img id="previous-version" alt=""><figcaption>이전 얼터</figcaption></figure><figure><img id="original" alt=""><figcaption><span>수정 얼터</span><a id="download-original" download>원본 저장</a></figcaption></figure></div>
<div class="pager"><button id="previous" aria-label="이전 캐릭터">← 이전</button><span id="position"></span><button id="next" aria-label="다음 캐릭터">다음 →</button></div></dialog>
<script type="module">
const grid=document.querySelector('#grid'),dialog=document.querySelector('#detail');let characters=[],selected=0,opener;
function render(){document.querySelector('#count').textContent=characters.length+'명';grid.replaceChildren(...characters.map((c,i)=>{const button=document.createElement('button');button.className='card';button.dataset.id=c.id;button.setAttribute('aria-label',c.name+' 원본 보기');const img=new Image();img.src=c.original.file;img.alt=c.name;img.loading='lazy';img.width=c.original.width||1254;img.height=c.original.height||1254;const name=document.createElement('span');name.className='name';name.textContent=c.name;button.append(img,name);button.onclick=()=>{opener=button;selected=i;show();dialog.showModal();document.body.style.overflow='hidden';};return button;}));}
function show(){const c=characters[selected],base=document.querySelector('#base'),original=document.querySelector('#original'),link=document.querySelector('#download-original');document.querySelector('#detail-name').textContent=c.name;document.querySelector('#position').textContent=`${selected+1} / ${characters.length}`;base.src=`../pixel-profiles-frame1-v1-20261017/${encodeURIComponent(c.baseId)}/original.png`;base.alt=c.name.replace(/^광기의 /,'')+' 기본 모습';const prior=document.querySelector('#previous-version');prior.src=`../pixel-profiles-alter-frame1-20261017/${encodeURIComponent(c.id)}/original.png`;prior.alt=c.name+' 이전 얼터';original.src=c.original.file;original.alt=c.name+' 얼터 원본';link.href=c.original.file;link.download=c.id+'-frame1-v2-original.png';}
document.querySelector('#close').onclick=()=>dialog.close();dialog.addEventListener('close',()=>{document.body.style.overflow='';opener?.focus();});dialog.addEventListener('click',e=>{if(e.target===dialog){const r=dialog.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)dialog.close();}});
const move=delta=>{selected=(selected+delta+characters.length)%characters.length;show();dialog.scrollTop=0;};document.querySelector('#previous').onclick=()=>move(-1);document.querySelector('#next').onclick=()=>move(1);dialog.addEventListener('keydown',e=>{if(e.key==='ArrowLeft')move(-1);if(e.key==='ArrowRight')move(1);});
try{const response=await fetch('profiles.json');if(!response.ok)throw Error(response.status);characters=(await response.json()).characters;render();}catch(e){document.querySelector('#error').hidden=false;console.error(e);}
</script></html>
