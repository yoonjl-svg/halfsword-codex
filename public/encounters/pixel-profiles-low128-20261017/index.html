mns:repeat(2,minmax(0,1fr));gap:14px;margin-top:18px}figure{margin:0;min-width:0}figcaption{display:flex;justify-content:space-between;gap:8px;font-size:13px;margin:9px 0}.pager{display:flex;justify-content:space-between;align-items:center;margin-top:18px;font-size:13px}.error{color:#e1bba1}@media(max-width:700px){main{padding:20px 12px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.compare{grid-template-columns:1fr}h1{font-size:21px}.dialog-head h2{font-size:15px}}

<main><h1>Stillness · 원본과 low</h1><p>기본·얼터 전체와 플레이어1·2<br>도트 크기와 액자를 통일한 low입니다. 눈과 얼굴 비중을 보완했으며, 인물 뒤의 배경은 투명합니다.</p>

<dialog id="detail" aria-labelledby="detail-name"><div class="dialog-head"><h2 id="detail-name"></h2><button id="close">닫기</button></div><div class="compare"><figure><div class="art"><img id="original" alt=""></div><figcaption><span>원본</span><a id="download-original" download>원본 저장</a></figcaption></figure><figure><div class="art low-art"><img id="low" alt=""></div><figcaption><span>low · 128 · 투명</span><a id="download-low" download>low 저장</a></figcaption></figure></div><div class="pager"><button id="previous">← 이전</button><span id="position"></span><button id="next">다음 →</button></div></dialog>
<script type="module">
const grid=document.querySelector('#grid'),dialog=document.querySelector('#detail');let characters=[],visible=[],group='all',mode='low',selected=0,opener;
function asset(c,k){return c[k].file+'?v='+c[k].sha256.slice(0,12)}
function render(){visible=characters.filter(c=>group==='all'||c.group===group);document.querySelector('#count').textContent=visible.length+'개 초상';grid.replaceChildren(...visible.map((c,i)=>{const b=document.createElement('button');b.className='card';b.dataset.id=c.id;b.setAttribute('aria-label',c.name+' 원본과 low 비교');const art=document.createElement('div'),img=new Image(),name=document.createElement('span'),caption=document.createElement('span');art.className='art '+(mode==='low'?'low-art':'');img.src=asset(c,mode);img.alt=c.name+' '+mode;img.width=1254;img.height=1254;name.className='name';name.textContent=c.name;caption.className='caption';caption.textContent=c.angleLabel||c.epithet||'';art.append(img);b.append(art,name,caption);b.onclick=()=>{opener=b;selected=i;show();dialog.showModal();document.body.style.overflow='hidden';};return b;}));}
function show(){const c=visible[selected];document.querySelector('#detail-name').textContent=c.name;document.querySelector('#position').textContent=`${selected+1} / ${visible.length}`;for(const k of ['original','low']){const i=document.querySelector('#'+k),a=document.querySelector('#download-'+k);i.src=asset(c,k);i.alt=c.name+' '+k;a.href=asset(c,k);a.download=c.id+'-'+k+'.png';}}
for(const type of ['group','mode','background'])document.querySelectorAll('button[data-'+type+']').forEach(b=>b.onclick=()=>{document.querySelectorAll('button[data-'+type+']').forEach(a=>a.setAttribute('aria-pressed',String(a===b)));if(type==='background'){document.body.dataset.background=b.dataset.background;return;}if(type==='group')group=b.dataset.group;else mode=b.dataset.mode;render();});
document.querySelector('#close').onclick=()=>dialog.close();dialog.addEventListener('close',()=>{document.body.style.overflow='';opener?.focus();});dialog.addEventListener('click',e=>{if(e.target===dialog){const r=dialog.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)dialog.close();}});function move(n){selected=(selected+n+visible.length)%visible.length;show();dialog.scrollTop=0;}document.querySelector('#previous').onclick=()=>move(-1);document.querySelector('#next').onclick=()=>move(1);dialog.addEventListener('keydown',e=>{if(e.key==='ArrowLeft')move(-1);if(e.key==='ArrowRight')move(1);});
document.querySelector('#toggle-grid').onclick=e=>{const on=document.body.dataset.grid!=='true';document.body.dataset.grid=String(on);e.currentTarget.setAttribute('aria-pressed',String(on));};
try{const r=await fetch('profiles.json',{cache:'no-store'});if(!r.ok)throw Error(r.status);characters=(await r.json()).characters;render();}catch(e){document.querySelector('#error').hidden=false;console.error(e);}
