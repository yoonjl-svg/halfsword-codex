<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>돌아온 왕 · Stillness</title><style>@font-face{font-family:p;src:url('./game/fonts/Pretendard-Regular.subset.woff2')}*{box-sizing:border-box}body{margin:0;background:#201d19;color:#ddcfb1;font-family:p,serif;line-height:1.8}main{max-width:1200px;margin:auto;padding:28px 20px 60px}h1{font-size:clamp(28px,5vw,42px);font-weight:500;margin:0 0 8px}h2{font-weight:500;font-size:24px;margin:0}p{color:#bdb096;margin:10px 0 20px}.kicker{color:#a88c55;font-size:14px;letter-spacing:.12em}nav{display:flex;gap:10px;flex-wrap:wrap;margin:20px 0}nav a{border:1px solid #a68d5d;box-shadow:inset 0 0 0 3px #211d18;background:#342c23;padding:9px 16px;text-decoration:none;color:inherit}figure{margin:18px 0}img{width:100%;height:auto;display:block;border:1px solid #5b4d39}figcaption{font-size:13px;color:#bdb096;margin-top:6px}.cards,.pair{display:grid;grid-template-columns:1fr 1fr;gap:24px}.cards section{min-width:0;border-top:1px solid #66563c;padding-top:20px}.portrait{max-width:540px;margin:20px auto}.label{border-bottom:1px solid #66563c;padding-bottom:10px;margin-top:28px;font-size:19px}a{color:inherit}summary{cursor:pointer;color:#c9b68f;padding:10px 0}blockquote{border-left:2px solid #977743;margin:24px 0;padding:10px 16px;background:#29221b}@media(max-width:700px){main{padding:20px 14px}.cards{grid-template-columns:1fr;gap:32px}.pair{gap:10px}nav a{flex:1;text-align:center}.pair figcaption{font-size:12px}}</style><main><div class="kicker">STILLNESS · 이베리아 중갑 기사</div><h1>세바스티앙 <small>돌아온 왕</small></h1><p>사자 머리를 덜어내고, 견갑 위에 짧은 상아색 금속 돌기를 세웠습니다.</p><figure class=""><a href="game-model-close.png?v=00ef69df"><img src="game-model-close.png?v=00ef69df" alt="수정한 세바스티앙 실제 게임 모델" loading="lazy"></a><figcaption>실제 게임 장면 · 외형을 자세히 보도록 카메라를 옮겼습니다.</figcaption></figure><nav><a href="game/?test=1&weapon=longsword&foe=sebastian&stage=cathedral&uniqueStage=5&nosw=1&review=00ef69df">상대로 만나기</a><a href="game/?test=1&hero=sebastian&weapon=tizona&foe=bran&foeWeapon=tree_branch&stage=cathedral&uniqueStage=5&nosw=1&review=00ef69df">직접 조작하기</a></nav><p>티소나 · 이베리아 유파 · 전신 판금<br>대성당은 임시 대련장입니다. 여정 저장은 바뀌지 않습니다.</p><div class="label">어깨 장식 · 같은 게임 카메라</div><div class="pair"><figure class=""><a href="before-detail.png?v=00ef69df"><img src="before-detail.png?v=00ef69df" alt="이전 사자 머리 장식" loading="lazy"></a><figcaption>이전 · 사자 머리 조각</figcaption></figure><figure class=""><a href="game-detail.png?v=00ef69df"><img src="game-detail.png?v=00ef69df" alt="짧은 상아색 금속 돌기" loading="lazy"></a><figcaption>수정 · 약 4cm 솟은 단순한 돌기와 금테 받침</figcaption></figure></div><figure class="portrait"><a href="front.png?v=00ef69df"><img src="front.png?v=00ef69df" alt="세바스티앙 정면 전신" loading="lazy"></a><figcaption>중립 조명과 공통 정면 축척에서 촬영한 실제 모델입니다.</figcaption></figure><details><summary>옆·뒤 모습 보기</summary><div class="pair"><figure class=""><a href="side.png?v=00ef69df"><img src="side.png?v=00ef69df" alt="세바스티앙 사선" loading="lazy"></a><figcaption>사선 · 단순해진 어깨 실루엣</figcaption></figure><figure class=""><a href="rear.png?v=00ef69df"><img src="rear.png?v=00ef69df" alt="세바스티앙 뒤쪽" loading="lazy"></a><figcaption>뒤쪽 · 상아빛 말총과 포도주색 망토</figcaption></figure></div></details><blockquote>“성문을 열어라. 아직 돌아올 자들이 있다.”</blockquote><p>군대가 사라진 뒤 왕만 홀로 돌아왔습니다. 갑옷과 망토는 출정하던 날 그대로였지만, 투구는 끝내 열리지 않았습니다.</p><nav><a href="../royal-concepts-20261022/?v=00ef69df">2번·3번 모델 보기</a></nav></main></html>
