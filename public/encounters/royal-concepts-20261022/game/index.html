    <link rel="modulepreload" crossorigin href="./assets/config-DIiO18sj.js">
    <link rel="modulepreload" crossorigin href="./assets/modulepreload-polyfill-P2Xu9kJm.js">

  <body>
    <canvas id="game"></canvas>

    <!-- 체력 게이지 없음: 피를 흘리거나 아프면 화면 가장자리가 붉게 물든다 -->
    <div id="topButtons">
      <button class="iconBtn" id="btnPause" aria-label="일시정지">Ⅱ</button>
    </div>
    <div id="toast"></div>
    <div id="emoMsg"></div>
    <div id="hint"></div>
    <div id="foeIntro"><b></b><i></i><span></span><small></small></div>
    <div id="stageInfo" aria-live="polite"><div class="stg"></div><em></em></div>
    <!-- 무기 뽑기 카드 세 장 (main.js 가 판마다 채운다. 단추 안이라 span 만 쓴다).
         왼쪽 두 장은 내가 고르는 카드(단추), 맨 오른쪽은 상대 무기 칸이라 누를 수도 초점을 받을 수도 없다(단추가 아니다) -->
    <div id="draw">
      <div class="drawRow">
        <button class="wcard" data-i="0"><span class="wcardInner"><span class="wback"></span><span class="wface"><small class="wwho">내 무기</small><span class="wthumb"></span><b class="wname"></b><small class="wsub"></small><span class="wtier"></span><span class="wdesc"></span><span class="wabil"></span></span></span></button>
        <button class="wcard" data-i="1"><span class="wcardInner"><span class="wback"></span><span class="wface"><small class="wwho">내 무기</small><span class="wthumb"></span><b class="wname"></b><small class="wsub"></small><span class="wtier"></span><span class="wdesc"></span><span class="wabil"></span></span></span></button>
        <div class="wcard foe" data-i="2" role="img"><span class="wcardInner"><span class="wback"></span><span class="wface"><small class="wwho">상대 무기</small><span class="wthumb"></span><b class="wname"></b><small class="wsub"></small><span class="wtier"></span><span class="wdesc"></span><span class="wabil"></span></span></span></div>
      </div>
    </div>
    <!-- 오른쪽 위 두 묶음: ① 자세 · (#techCue 안) ② 패시브·비기 — 둘 다 줄 하나 (10/10 20:3x, §14) -->
    <div id="guardName" class="slot"></div>
    <div id="staminaHud"></div>
    <div id="techCue"><div id="techSlot" class="stack" aria-live="polite"><div class="slot"></div></div></div>
    <div id="moveStick" aria-label="이동 조이스틱"><div id="moveKnob"></div></div>
    <button id="btnParry" aria-label="막기 (누르고 있기)">막기</button>

    <div class="overlay show" id="menu">
      <div class="card">
        <!-- 패배 창 (사장님 10/17 22:1x '패배하면 팝업창에 나를 패배시킨 캐릭터가 프로필이 뜨고, 그 오른쪽이든 아래든 적절한 곳에 대사 출력'): 왼쪽 정사각 프로필(그림 안에 액자 1) ·
             오른쪽 칸 = 아래 .card-body (제목 · 진 까닭 · “대사” · 금화 · 단추). 이긴 판 · 정지 · 시작 창은 숨김 (main.js showDefeatFoe) -->
        <figure class="foe-portrait" id="menuFoe" hidden><img id="menuFoeImg" alt="" draggable="false" decoding="async"></figure>
        <div class="card-body">
        <h1 id="menuTitle"><span class="wordmark">Stillness</span></h1>
        <p class="sub" id="menuSub">길 위에선 이름을 묻지 않는다.</p>
        <p class="foe-line" id="menuFoeLine" hidden><span id="menuFoeQuote"></span><small id="menuFoeSource"></small></p> <!-- 패배 창: 진 순간 고른 상대의 승리 대사(출처가 있으면 아래 줄 — 싸움 화면 대사 칸과 같은 꼴 · 10/18 01:4x 부터 싸움 화면엔 안 띄움) -->
        <p class="reward" id="menuReward" hidden></p> <!-- 결과 창: 이번 판 금화 · 머리 (첫 화면·대기실 여정만 — main.js) -->
        <!-- 상대 난이도 줄은 뺐다 (사장님 결정 10/13 '상대 난이도는 메뉴에서 빼자' — 상대의 실력은 인물 숙련도가 정한다, characters.js · main.js) -->
        <!-- 검술 보정 단계 메뉴(끔·약·보통·강)는 뺐다 — 사장님 10/8 21:5x "플레이어에겐 구분이 필요 없어. 한 단계로 기본 적용": 보정은 늘 0.7 (main.js DEFAULTS.skill) -->
        <!-- 10/10 19:2x 사장님 '시작 전 설정에서도 뺄 기능이 많아': 자세 이름 · 피 · 조작 흔적 · 유파 기술 알림 · 소리 · 비기 화면 번쩍임 · 비기 카메라 연출은 늘 켬,
             픽셀 모드(실험 ?pixel=1)는 주소 인자로만, 기울기 이동은 기능째 지웠다 (main.js DEFAULTS). 모든 기술 이름(디버그 ?techCueAll=1)은 10/14 03:3x 상대 기술 표기와 함께 걷어냈다 -->
        <div class="row" id="fpsRow"><span>화면 60 fps 제한</span><button class="toggle" data-setting="fpsCap" aria-label="화면 60 fps 제한"></button></div>
        <!-- 시작 단추는 카드 아래에 붙여 둔다: 가로로 든 폰에서 설정 목록이 길어도 스크롤 없이 보인다 -->
        <div class="actions">
          <button class="primary" id="btnStart">여정 시작</button> <!-- 사장님 10/14 11:0x "싸움 시작 문구는 유치해. 여정 시작" -->
          <button class="secondary" id="btnResume" style="display:none">계속하기</button>
          <button class="secondary" id="btnLobby" hidden>대기실</button> <!-- 정지 · 결과 창: 첫 화면·대기실로 연 여정만 — 판을 떠나 대기실로 (사장님 10/16 08:3x · main.js toLobby) -->
        </div>
        <ul class="howto" id="howto"></ul>
        </div>
      </div>
    </div>

    <div id="rotate"><div>📱↻<br />폰을 가로로 돌려 주세요<small>돌리면 바로 이어집니다</small></div></div>

    <!-- 첫 모듈 = 게임 들머리: 인자 없는 주소는 첫 화면 → 대기실 → 여정, 게임 인자가 있는 주소는 지금처럼 곧바로 게임(main.js) -->
  </body>
