<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />

    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#1b1410" />

    <title>Stillness</title>
    <style>:root{--ink:#f3e9d8;--dim:#b8a88e;--panel:#18120ee0;--line:#f3e9d82e;--accent:#d9a441;--red:#b3261e;--blue:#3f6fb5}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{height:100%;color:var(--ink);touch-action:none;overscroll-behavior:none;-webkit-user-select:none;user-select:none;background:#1b1410;margin:0;font-family:system-ui,-apple-system,Apple SD Gothic Neo,Noto Sans KR,sans-serif;overflow:hidden}#game{touch-action:none;width:100%;height:100%;display:block;position:fixed;inset:0}#game.pixel{image-rendering:pixelated;image-rendering:crisp-edges}#hud{pointer-events:none;display:none;position:fixed;inset:0}#hud.show{display:block}#vignette{opacity:0;background:radial-gradient(#78000000 45%,#7800008c 78%,#3c0000e6 100%);transition:opacity .2s;position:absolute;inset:0}#emotion{opacity:0;transition:opacity .4s;position:absolute;inset:0}#emotion[data-emotion=fear]{background:radial-gradient(#3c506e00 50%,#3c506e80 85%,#141e32cc 100%)}#emotion[data-emotion=anger]{background:radial-gradient(#c81e0000 55%,#c81e0073 88%,#780000cc 100%)}#emotion[data-emotion=obsession]{background:radial-gradient(#dcaa2800 55%,#dcaa2866 88%,#8c5a00bf 100%)}#topButtons{top:max(8px, env(safe-area-inset-top));z-index:2;gap:8px;display:none;position:fixed;left:50%;transform:translate(-50%)}#topButtons.show{display:flex}.iconBtn{border:1px solid var(--line);background:var(--panel);width:38px;height:38px;color:var(--ink);border-radius:50%;font-size:17px}#toast{letter-spacing:.06em;text-shadow:0 3px #000;pointer-events:none;opacity:0;font-size:clamp(28px,7vw,64px);font-weight:800;transition:opacity .3s;position:fixed;top:58%;left:50%;transform:translate(-50%,-50%)}#toast.show{opacity:1}#emoMsg{left:50%;bottom:calc(max(12px, env(safe-area-inset-bottom)) + 44px);letter-spacing:.02em;pointer-events:none;opacity:0;text-shadow:0 1px 2px #000,0 0 8px #000000b3;white-space:nowrap;font-size:16px;font-weight:700;transition:opacity .35s;position:fixed;transform:translate(-5 :inline}#foeIntro i:not(:empty):before{content:" · "}}#draw{z-index:1;--top:150px;--cw:200px;--ch:290px;--gap:14px;--name:17px;--desc:12.5px;--kb:10px;display:none;position:fixed;inset:0}#draw.show{display:block}#draw:before{content:"";background:radial-gradient(at 50% 62%,#100a069e,#100a0647 72%);transition:opacity .4s;animation:.35s ease-out backwards drawFade;position:absolute;inset:0}#draw.fly:before{opacity:0}.drawRow{top:var(--top);bottom:max(8px, env(safe-area-inset-bottom));left:max(16px, env(safe-area-inset-left));right:max(16px, env(safe-area-inset-right));justify-content:center;align-items:center;gap:var(--gap);display:flex;position:absolute}.wcard{width:var(--cw);height:var(--ch);color:inherit;font:inherit;perspective:900px;cursor:pointer;touch-action:manipulation;background:0 0;border:0;outline:none;flex:none;margin:0;padding:0;transition:transform .45s cubic-bezier(.2,.8,.3,1),opacity .4s,translate .15s;animation:.42s cubic-bezier(.2,.8,.3,1) backwards dealIn;position:relative}.wcard:nth-child(2){animation-delay:70ms}.wcard:nth-child(3){animation-delay:.14s}.wcardInner{transform-style:preserve-3d;-webkit-transform-style:preserve-3d;transition:transform .45s cubic-bezier(.35,.1,.25,1);position:absolute;inset:0}.wcard.flipped .wcardInner{transform:rotateY(180deg)}.wback,.wface{backface-visibility:hidden;border-radius:10px;position:absolute;inset:0;overflow:hidden}.wback{background-color:var(--backBg,#1c130c);background-image:var(--backImg,none);background-position:50%;background-repeat:no-repeat;background-size:var(--backSize,100% 100%);border:1px solid #d9a44199;box-shadow:0 8px 20px #00000080}#draw[data-back=classic] .wback{background:radial-gradient(circle,#d9a44133,#d9a44100 58%),repeating-linear-gradient(45deg,#fff0d209 0 2px,#0000 2px 10px),repeating-linear-gradient(-45deg,#fff0d209 0 2px,#0000 2px 10px),linear-gradient(160deg,#3d2a1b,#1c130c);box-shadow:0 8px 20px #00000080,inset 0 0 0 5px #1c130ce6,inset 0 0 0 6px #d9a4416b}.wback svg{width:min(4 ction:column;align-items:center;padding:8px 9px 10px;display:flex;transform:rotateY(180deg);box-shadow:0 8px 20px #00000080,inset 0 0 0 1px #0009}.wwho{letter-spacing:.08em;color:#1b1410;background:#d9a441;border-radius:999px;flex:none;margin-bottom:1px;padding:3px 8px 2px 9px;font-size:11px;font-weight:700;line-height:1;display:none}.wcard.picked .wwho,.wcard.foe .wwho{display:block}.wcard.foe .wwho{color:#fbe9e2;background:#93372d}.wthumb{filter:drop-shadow(0 2px 3px #0000008c);background-position:50%;background-repeat:no-repeat;background-size:contain,100% 100%;flex:auto;width:100%;min-height:36px}.wname{font-size:var(--name);color:var(--tc);text-shadow:0 0 10px var(--tg), 0 1px 1px #000;word-break:keep-all;margin-top:2px;font-weight:800;line-height:1.15;display:block}.wsub{color:#cfc0a2;word-break:keep-all;font-size:12px;line-height:1.25;display:block}.wsub:empty{display:none}.wtier{letter-spacing:.12em;color:var(--tc);border:1px solid var(--tc);opacity:.9;border-radius:999px;margin:4px 0;padding:3px 8px 2px 9px;font-size:12px;font-weight:700;line-height:1;display:inline-block}.wdesc{font-size:var(--desc);color:#ece1cb;word-break:keep-all;text-wrap:balance;margin:0;line-height:1.34;display:block}.wabil{font-size:var(--desc);color:var(--tc);word-break:keep-all;text-wrap:balance;margin:2px 0 0;line-height:1.3;display:block}.wabil:empty{display:none}#draw.wide .wsub{font-size:13px}#draw.wide .wtier{margin:6px 0;font-size:13px}#draw.low .wface{padding:6px 7px 7px}#draw.low .wthumb{min-height:28px}#draw.low .wtier{margin:2px 0}.wcard.picked{z-index:1;transform:translateY(-1%)scale(1.03)}.wcard.picked .wface{box-shadow:0 0 0 2px #d9a441, 0 10px 26px #0000008c, 0 0 24px var(--tg)}.wcard.missed{transform:scale(.92)}.wcard.missed .wface:after{content:"";background:#0e09065c;position:absolute;inset:0}.wcard.missed .wthumb{filter:grayscale(.7)}.wcard.foe.flipped .wface{box-shadow:0 0 0 2px #b0473b, 0 10px 26px #0000008c, 0 0 24px var(--tg)}.wcard.grand:before{content:"";opacity:0;pointer-events:none;border-radius:10px;transition:opacity .3s .2s;position:absolute;inset:0;box-shadow:0 0 30px 8px #ffcd46bf,0 0 8px 2px #ffeca0e6}.wcard.grand.flipped:before{opacity:1;animation:1.1s ease-in-out .5s infinite alternate grandPulse}.wcard.grand.missed:before{opacity:.35;animation:none}@media (hover:hover){#draw.choose .wcard:not(.foe):hover{translate:0 -5px}#draw.choose .wcard:not(.foe):hover .wback{border-color:#f0c768}}.wcard:focus-visible .wback{border-color:#f0c768;box-shadow:0 0 0 2px #f0c768,0 8px 20px #00000080}#draw.fly .wcard{opacity:0;transition:transform .45s cubic-bezier(.5,0,.8,.4),opacity .4s ease-in}#draw.fly .wcard.picked{transform:translateY(40%)scale(.5)}#draw.fly .wcard.missed{transform:translateY(-14%)scale(.8)}#draw.fly .wcard.foe{transform:translateY(-22%)scale(.55)}@keyframes dealIn{0%{opacity:0;transform:translateY(26px)scale(.88)}}@keyframes nope{20%{translate:-5px}45%{translate:4px}70%{translate:-2px}}@keyframes drawFade{0%{opacity:0}}@keyframes grandPulse{0%{opacity:.55}to{opacity:1}}#moveStick{left:max(20px, env(safe-area-inset-left));bottom:max(20px, env(safe-area-inset-bottom));border:1px solid var(--line);touch-action:none;background:#18120e73;border-radius:50%;width:110px;height:110px;display:none;position:fixed}#moveStick.show{display:block}body:not(.touch) .touchOnly,body.moveStick .tiltOnly{display:none}#moveKnob{background:var(--panel);border:1px solid var(--line);pointer-events:none;border-radius:50%;width:48px;height:48px;margin:-24px 0 0 -24px;position:absolute;top:50%;left:50%}.overlay{z-index:3;background:radial-gradient(#1b14108c,#1b1410eb);justify-content:center;align-items:center;padding:16px;display:none;position:fixed;inset:0}.overlay.show{display:flex}.card{background:var(--panel);border:1px solid var(--line);touch-action:pan-y;border-radius:10px;width:min(460px,100%);max-height:100%;padding:20px;overflow-y:auto}h1{letter-spacing:.04em;margin:0 0 4px;font-size:26px}h2{margin:0 0 12px;font-size:22px}.sub{color:var(--dim);margin:0 0 16px;font-size:13px;line-height:1.5}.row{border-top:1px solid var(--line);justify-content:space-between;align-items:center;gap:12px;padding:9px 0;font-size:14px;display:flex}.seg{border:1px solid var(--line);border-radius:6px;display:flex;overflow:hidden}.seg button{color:var(--dim);background:0 0;border:0;padding:6px 10px;font-size:13px}.seg button.on{background:var(--accent);color:#1b1410;font-weight:700}.toggle{border:1px solid var(--line);background:#0006;border-radius:12px;width:44px;height:24px;position:relative}.toggle:after{content:"";background:var(--dim);border-radius:50%;width:18px;height:18px;transition:left .15s;position:absolute;top:2px;left:2px}.toggle.on{background:var(--accent)}.toggle.on:after{background:#1b1410;left:22px}.primary{background:var(--accent);color:#1b1410;border:0;border-radius:8px;width:100%;margin-top:16px;padding:14px;font-size:17px;font-weight:800}.secondary{border:1px solid var(--line);width:100%;color:var(--ink);background:0 0;border-radius:8px;margin-top:8px;padding:11px;font-size:14px}.actions{background:var(--panel);margin:0 -20px -20px;padding:0 20px 20px;position:sticky;bottom:-20px}.howto{color:var(--dim);margin:12px 0 0;padding-left:18px;font-size:13px;line-height:1.6}.minor{color:var(--accent);margin-left:6px;font-size:12px}@media (height<=500px){.card{width:min(560px,100%);padding:12px 16px}h1{font-size:20px}.sub{margin-bottom:8px}.row{padding:4px 0;font-size:13px}.primary{margin-top:10px;padding:10px;font-size:16px}.secondary{padding:8px}.howto{display:none}.actions{margin:0 -16px -12px;padding:0 16px 12px;bottom:-12px}}#rotate{text-align:center;z-index:10;background:#1b1410;justify-content:center;align-items:center;padding:24px;font-size:18px;display:none;position:fixed;inset:0}@media (orientation:portrait) and (pointer:coarse){#rotate.enabled{display:flex}}</style>

  <body>
    <canvas id="game"></canvas>

    <!-- 체력 게이지 없음: 피를 흘리거나 아프면 화면 가장자리가 붉게 물든다 -->
    <div id="hud"><div id="vignette"></div><div id="emotion"></div></div>
    <div id="topButtons">
      <button class="iconBtn" id="btnPause" aria-label="일시정지">Ⅱ</button>
      <button class="iconBtn" id="btnCalib" aria-label="기울기 영점 맞추기">◎</button>
    </div>
    <div id="toast"></div>
    <div id="emoMsg"></div>
    <div id="hint"></div>
    <div id="foeIntro"><b></b><i></i><span></span><em></em></div>
    <!-- 무기 뽑기 카드 세 장 (main.js 가 판마다 채운다. 단추 안이라 span 만 쓴다).
         왼쪽 두 장은 내가 고르는 카드(단추), 맨 오른쪽은 상대 무기 칸이라 누를 수도 초점을 받을 수도 없다(단추가 아니다) -->
    <div id="draw">
      <div class="drawRow">
        <button class="wcard" data-i="0"><span class="wcardInner"><span class="wback"></span><span class="wface"><small class="wwho">내 무기</small><span class="wthumb"></span><b class="wname"></b><small class="wsub"></small><span class="wtier"></span><span class="wdesc"></span><span class="wabil"></span></span></span></button>
        <button class="wcard" data-i="1"><span class="wcardInner"><span class="wback"></span><span class="wface"><small class="wwho">내 무기</small><span class="wthumb"></span><b class="wname"></b><small class="wsub"></small><span class="wtier"></span><span class="wdesc"></span><span class="wabil"></span></span></span></button>
        <div class="wcard foe" data-i="2" role="img"><span class="wcardInner"><span class="wback"></span><span class="wface"><small class="wwho">상대 무기</small><span class="wthumb"></span><b class="wname"></b><small class="wsub"></small><span class="wtier"></span><span class="wdesc"></span><span class="wabil"></span></span></span></div>
      </div>
    </div>
    <div id="guardName"></div>
    <div id="moveStick" aria-label="이동 조이스틱"><div id="moveKnob"></div></div>

    <div class="overlay show" id="menu">
      <div class="card">
        <h1 id="menuTitle">Stillness</h1>
        <p class="sub" id="menuSub">길 위에선 이름을 묻지 않는다.</p>
        <div class="row"><span>상대 난이도</span>
          <div class="seg" data-setting="difficulty">
            <button data-v="easy">쉬움</button><button data-v="normal">보통</button><button data-v="hard">어려움</button>
          </div>
        </div>
        <div class="row"><span>검술 보정</span>
          <div class="seg" data-setting="skill">
            <button data-v="0">끔</button><button data-v="0.4">약</button><button data-v="0.7">보통</button><button data-v="1">강</button>
          </div>
        </div>
        <div class="row"><span>조작 흔적 보기</span><button class="toggle" data-setting="trail" aria-label="조작 흔적 보기"></button></div>
        <div class="row"><span>자세 이름 보기</span><button class="toggle" data-setting="guardNames" aria-label="자세 이름 보기"></button></div>
        <div class="row"><span>픽셀 모드 (실험)</span><button class="toggle" data-setting="pixel" aria-label="픽셀 모드"></button></div>
        <div class="row"><span>화면 갱신 60 fps 묶기</span><button class="toggle" data-setting="fpsCap" aria-label="화면 갱신 60 fps 묶기"></button></div>
        <div class="row"><span>피 표현</span><button class="toggle" data-setting="blood" aria-label="피 표현"></button></div>
        <div class="row"><span>소리 <a class="minor" href="sounds.html" target="_blank" rel="noopener">들어보기</a></span><button class="toggle" data-setting="sound" aria-label="소리"></button></div>
        <div class="row touchOnly"><span>이동 방식</span>
          <div class="seg" data-setting="moveMode">
            <button data-v="stick">조이스틱</button><button data-v="tilt">기울기</button>
          </div>
        </div>
        <div class="row touchOnly tiltOnly"><span>기울기 방향 반대로</span><button class="toggle" data-setting="invertTilt" aria-label="기울기 반전"></button></div>
        <!-- 시작 단추는 카드 아래에 붙여 둔다: 가로로 든 폰에서 설정 목록이 길어도 스크롤 없이 보인다 -->
        <div class="actions">
          <button class="primary" id="btnStart">싸움 시작</button>
          <button class="secondary" id="btnResume" style="display:none">계속하기</button>
        </div>
        <ul class="howto" id="howto"></ul>
      </div>
    </div>

    <div id="rotate">📱↻<br />폰을 가로로 돌려주세요</div>

  </body>
</html>
