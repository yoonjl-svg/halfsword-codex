<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1b1410" />
    <title>소리 들어보기 · Stillness</title>
    <style>:root{--ink:#f3e9d8;--dim:#b8a88e;--panel:#18120ee0;--line:#f3e9d82e;--accent:#d9a441}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{color:var(--ink);background:#1b1410;margin:0;font-family:system-ui,-apple-system,Apple SD Gothic Neo,Noto Sans KR,sans-serif}main{max-width:640px;padding:max(16px, env(safe-area-inset-top)) 16px 40px;margin:0 auto}h1{margin:0 0 6px;font-size:22px}p{color:var(--dim);margin:0 0 12px;font-size:13px;line-height:1.6}a{color:var(--accent)}.bar{flex-wrap:wrap;gap:8px;margin:12px 0;display:flex}.seg{border:1px solid var(--line);border-radius:6px;display:flex;overflow:hidden}.seg button,.tog{color:var(--dim);background:0 0;border:0;padding:8px 12px;font-size:14px}.tog{border:1px solid var(--line);border-radius:6px}.seg button.on,.tog.on{background:var(--accent);color:#1b1410;font-weight:700}.row{border-top:1px solid var(--line);justify-content:space-between;align-items:center;gap:12px;padding:10px 0;display:flex}.row b{font-size:15px;display:block}.row small{color:var(--dim);font-size:12px}.btns{flex-shrink:0;gap:6px;display:flex}.btns button{border:1px solid var(--line);background:var(--panel);width:52px;height:44px;color:var(--ink);touch-action:none;-webkit-user-select:none;user-select:none;border-radius:8px;font-size:15px}.btns button:active{background:var(--accent);color:#1b1410}#demo{background:var(--accent);color:#1b1410;border:0;border-radius:8px;width:100%;margin:14px 0 6px;padding:14px;font-size:16px;font-weight:800}#info{color:var(--dim);min-height:1.5em;font-size:12px}</style>
    <script type="module" crossorigin src="/halfsword/r2p/assets/sounds-KxJZNq3O.js"></script>
    <link rel="modulepreload" crossorigin href="/halfsword/r2p/assets/sound-D-5MRBBS.js">
  </head>
  <body>
    <main>
      <h1>소리 들어보기</h1>
      <p>
        버튼을 누르면 게임 속 소리가 약·중·강 세기로 나와요. 이어폰과 폰 스피커 둘 다로 들어 보세요.
        아이폰은 옆면 무음 스위치가 켜져 있으면 소리가 안 나요. <a href="./">← 게임으로</a>
      </p>
      <div class="bar">
        <div class="seg"><button data-engine="new" class="on">새 소리</button><button data-engine="old">예전 소리</button></div>
        <button class="tog on" id="samples">녹음 소리 섞기</button>
        <button class="tog on" id="reverb">경기장 울림</button>
      </div>
      <button id="demo">짧은 공방 한 장면 듣기</button>
      <div id="info"></div>
      <div id="rows"></div>
      <p style="margin-top: 16px">
        녹음 소리 일부: Kenney.nl "Impact Sounds", "RPG Audio" (CC0). 나머지는 모두 코드로 합성해요 (src/sound.js).
      </p>
    </main>
  </body>
</html>
