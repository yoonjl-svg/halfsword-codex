<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1b1410" />
    <link rel="icon" href="data:," />
    <title>소리 들어보기 · Stillness</title>
    <style>
      :root { --ink: #f3e9d8; --dim: #b8a88e; --panel: rgba(24, 18, 14, 0.88); --line: rgba(243, 233, 216, 0.18); --accent: #d9a441; }
      * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
      body { margin: 0; background: #1b1410; color: var(--ink); font-family: system-ui, -apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; }
      main { max-width: 640px; margin: 0 auto; padding: max(16px, env(safe-area-inset-top)) 16px 40px; }
      h1 { font-size: 22px; margin: 0 0 6px; }
      p { color: var(--dim); font-size: 13px; line-height: 1.6; margin: 0 0 12px; }
      a { color: var(--accent); }
      .bar { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0; }
      .seg { display: flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
      .seg button, .tog { background: transparent; color: var(--dim); border: 0; padding: 8px 12px; font-size: 14px; }
      .tog { border: 1px solid var(--line); border-radius: 6px; }
      .seg button.on, .tog.on { background: var(--accent); color: #1b1410; font-weight: 700; }
      .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 0; border-top: 1px solid var(--line); }
      .row b { font-size: 15px; display: block; }
      .row small { color: var(--dim); font-size: 12px; }
      .btns { display: flex; gap: 6px; flex-shrink: 0; }
      .btns button { width: 52px; height: 44px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); font-size: 15px; touch-action: none; user-select: none; -webkit-user-select: none; }
      .btns button:active { background: var(--accent); color: #1b1410; }
      #demo { width: 100%; margin: 14px 0 6px; padding: 14px; font-size: 16px; font-weight: 800; border: 0; border-radius: 8px; background: var(--accent); color: #1b1410; }
      #info { color: var(--dim); font-size: 12px; min-height: 1.5em; }
      @media (max-width: 560px) {
        .row { flex-direction: column; align-items: stretch; }
        .btns { flex-wrap: wrap; }
        .btns button { width: auto; min-width: 52px; min-height: 44px; height: auto; padding: 6px 8px; }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>소리 들어보기</h1>
      <p><a href="./voices.html">인물별 목소리 · 이전/새 배정 비교</a></p>
      <p>
        버튼을 누르면 게임 속 소리가 약·중·강 세기로 나와요. 이어폰과 폰 스피커 둘 다로 들어 보세요.
        아이폰은 옆면 무음 스위치가 켜져 있으면 소리가 안 나요. <a href="./">← 게임으로</a>
      </p>
      <div class="bar">
        <div class="seg"><button data-engine="new" class="on">새 소리</button><button data-engine="old">예전 소리</button></div>
        <button class="tog on" id="samples">녹음 소리 섞기</button>
        <button class="tog on" id="reverb">경기장 울림</button>
      </div>
      <button id="demo">짧은 공방 한 장면 듣기</button>
      <div id="info"></div>
      <div id="rows"></div>
      <p style="margin-top: 16px">
        녹음 소리 일부: Kenney.nl "Impact Sounds", "RPG Audio" (CC0). 나머지는 모두 코드로 합성해요 (src/sound.js).
      </p>
    </main>
    <script type="module" src="/src/soundlab.js"></script>
  </body>
</html>
