<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Stillness · 흘림 시험</title><style>
@font-face{font-family:Stillness;src:url(game/fonts/Pretendard-Regular.subset.woff2)}*{box-sizing:border-box}html,body{margin:0;height:100%;background:#1e1d19;color:#dbd0b7;font-family:Stillness,serif}body{display:flex;flex-direction:column}header{display:flex;align-items:center;gap:12px;padding:7px max(12px,env(safe-area-inset-right));border-bottom:1px solid #796c4f;min-height:42px;font-size:12px}header strong{font-weight:normal;color:#efe0bd}#status{flex:1;color:#b8b09f}button,select{font:inherit;color:#e5d9bc;background:#333027;border:1px solid #918164;padding:8px 12px;border-radius:0;cursor:pointer}button:focus,select:focus{outline:2px solid #d6ad65}iframe{border:0;width:100%;flex:1;background:#171713}dialog{width:min(520px,94vw);background:#25231e;color:#dbd0b7;border:2px solid #958363;padding:24px}dialog::backdrop{background:#111d}h1{font-size:23px;font-weight:normal;margin:0 0 18px}p{font-size:13px;line-height:1.7;color:#c1b8a4}label{display:grid;grid-template-columns:100px 1fr;align-items:center;gap:12px;margin:12px 0;font-size:14px}select{width:100%;min-width:0}footer{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}#close{font-size:12px}small{font-size:11px;color:#aaa18e}@media(max-height:470px){dialog{padding:15px;width:620px}h1{font-size:18px;margin-bottom:6px}label{margin:7px 0}p{margin:5px 0;line-height:1.45}footer{margin-top:10px}}
</style></head><body><header><strong>흘림 시험</strong><span id="status">역할과 회복 시간을 골라 주세요.</span><button id="settings">비교 설정</button></header><iframe id="game" title="Stillness 흘림 시험 게임" allow="autoplay; fullscreen 'none'"></iframe><dialog id="options"><h1>일본 막기 · 짧은 회복 지연</h1><p>흘림당한 쪽은 팔의 제어력을 잠시 잃고 부드럽게 회복합니다. 이동은 계속할 수 있습니다. 휴대폰은 가로로 돌려 주세요.</p><label>내 역할<select id="role"><option value="defender">방어자 · 일본 검으로 흘리기</option><option value="attacker">공격자 · 청강검으로 일본 막기 상대</option></select></label><label>회복 시간<select id="duration"><option value="base">기존 그대로</option><option value="0">입력 전환만 보완 · 경직 없음</option><option value="0.18">0.18초</option><option value="0.24">0.24초</option><option value="0.30">0.30초</option><option value="0.36" selected>0.36초 · 추천 시험값</option><option value="0.45">0.45초 · 긴 비교값</option></select></label><label>상대 행동<select id="practice"><option value="0">보통 대련</option><option value="1">반복 연습 · 내려베기 / 머리 위 고정 방어</option></select></label><p id="hint">막기를 누르고 내려오는 칼을 받은 뒤, 직접 베거나 찔러 보세요.</p><small>흘림 판정·힘은 기존과 같습니다. 매번 흘림이 나오거나 반격이 성공하지는 않습니다. 기존 저장 기록에 영향을 주지 않는 별도 시험판입니다.</small><footer><button id="close">돌아가기</button><button id="start">이 조건으로 시작</button></footer></dialog><script>
const $=id=>document.getElementById(id),q=new URLSearchParams(location.search);let running=false;
for(const id of ['role','duration','practice'])if([...$(id).options].some(o=>o.value===q.get(id)))$(id).value=q.get(id);
function hint(){$('hint').textContent=$('role').value==='attacker'?'칼을 들어 내려벤 뒤 곧바로 되돌려 보세요. 흘림당할 때 손의 반응과 이동 가능 여부를 비교해 주세요.':'막기를 누르고 내려오는 칼을 받은 뒤, 직접 베거나 찔러 보세요.';}
$('role').onchange=hint;hint();$('options').showModal();$('settings').onclick=()=>{$('options').showModal();$('game').contentWindow?.postMessage({type:'lab-pause'},location.origin);};$('close').onclick=()=>{if(running)$('options').close();};
$('start').onclick=()=>{const role=$('role').value,d=$('duration').value,p=$('practice').value;history.replaceState(null,'',`?role=${role}&duration=${d}&practice=${p}`);const a=new URLSearchParams({test:'1',weapon:role==='defender'?'uchigatana':'qinggang',foeWeapon:role==='defender'?'longsword':'uchigatana',foe:role==='defender'?'bran':'minami',stage:'poseidon',uniqueStage:'2',slowMo:'0',openSweep:'0',role,recovery:d,practice:p});$('game').src='game/index.html?'+a;running=true;$('options').close();$('status').textContent='게임을 불러오는 중…';};
window.addEventListener('message',e=>{if(e.origin!==location.origin||e.source!==$('game').contentWindow||e.data?.type!=='stillness-flow-lab')return;const s=e.data;const role=s.role==='defender'?'방어자':'공격자';const duration=s.value==='base'?'기존':s.value+'초';$('status').textContent=`${role} · ${duration} | 내가 흘림 ${s.flows[0]} · 상대가 흘림 ${s.flows[1]}`;});
</script></body></html>
