<!doctype html><html lang="ko"><meta charset="utf-8"><title>동방 막기 · 칼날 경로 연구</title><link rel="icon" href="data:,"><style>body{margin:0;padding:22px;background:#202329;color:#e7dcc6;font:17px sans-serif}h1{font-size:25px;margin:0 0 10px}p,footer{font-size:16px;color:#c8bfaf;line-height:1.5}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.card{padding:10px;background:#2a2e34;border:1px solid #575a60}h2{font-size:17px;margin:0 0 8px}img{width:100%;display:block}.meta{margin-top:8px;line-height:1.5;white-space:pre-line}</style>
<h1>동방 막기 · 칼날 경로에 맞춰 방어선을 되잡는 후보</h1><p>실제 게임 모델·물리 엔진 / 로컬 연구판의 동일 공격·동일 입력<br>위: 기존 막기. 아래: 경로 판독 후보. 주황 선은 상대 칼날입니다.</p><main class="grid" id="shots"></main><footer>아래 후보는 이 공격에서 목의 치명상을 피했지만, 머리 둔타로 의식 44%와 균형을 잃었습니다.<br>완전 방어가 아니며, 한 장면의 이득을 전체 개선으로 해석하지 않습니다.</footer>
<script>window.process={env:{}};</script><script type="module">
import * as THREE from 'three';
import {trial} from './parry_reading_trials.mjs';
import {contactGuard} from './chinese_contact_guard.mjs';
import {observeHealth} from './chinese_benefit_model.mjs';
import {DT} from './harness_m.mjs';
const renderer=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});renderer.setSize(384,340);renderer.setPixelRatio(1);renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.setClearColor(0x45464a);renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.2;
const camera=new THREE.PerspectiveCamera(33,384/340,.05,40),shots=[];
let visualSeed=7919;const visualRandom=()=>{visualSeed=(Math.imul(visualSeed,1664525)+1013904223)>>>0;return visualSeed/4294967296;};
const params=new URLSearchParams(location.search),name=params.get('attack')??'talhoReves',lead=+(params.get('lead')??.2),press=name==='talhoReves'?113/120:+params.get('press');
for(const kind of ['base','path']){
 let initialized=false,index=0,marker,observer,clock=0,health;const captures=[],times=[1.075,1.125,1.175];const Parent=contactGuard(kind);class Guard extends Parent{constructor(d,a){super(d,a);observer=observeHealth(d,()=>clock);}}
 const result=trial({cfg:'qinggang',atk:'qinggang',name,gap:1.1,playerModel:true,Guard,heldAt:t=>t+1e-9>=press,onFrame(G,g){
  clock=G.t;observer.step(DT,g);health=observer.finish();
  const physicsRandom=Math.random;Math.random=visualRandom;try{
  const scene=G.player.scene;
  if(!initialized){initialized=true;scene.add(new THREE.HemisphereLight(0xfff8e8,0x4e5060,2.1));const sun=new THREE.DirectionalLight(0xfff2d2,2.5);sun.position.set(-3,6,5);scene.add(sun);const floor=new THREE.Mesh(new THREE.PlaneGeometry(12,12),new THREE.MeshStandardMaterial({color:0x5d5b54,roughness:1}));floor.rotation.x=-Math.PI/2;floor.position.y=-.005;scene.add(floor);const grid=new THREE.GridHelper(12,24,0x999388,0x737069);grid.position.y=.001;scene.add(grid);marker=new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(),new THREE.Vector3()]),new THREE.LineBasicMaterial({color:0xffa74f,depthTest:false}));marker.renderOrder=10;scene.add(marker);}
  if(index<times.length&&G.t+1e-8>=times[index]){
   G.player.syncMeshes();G.enemy.syncMeshes();const a=G.player.bodies.chest.translation(),b=G.enemy.bodies.chest.translation();const center=new THREE.Vector3((a.x+b.x)/2,1.3,(a.z+b.z)/2);camera.position.copy(center).add(new THREE.Vector3(-2.5,1.3,4.5));camera.lookAt(center);
   marker.geometry.setFromPoints([G.enemy.bladePoint(0,new THREE.Vector3()),G.enemy.bladePoint(1,new THREE.Vector3())]);renderer.render(scene,camera);
   captures.push({kind,t:G.t,line:g.line,mode:g.mode,held:g.held,alive:G.player.alive,state:G.player.state,lock:g.lock?.line??null,image:renderer.domElement.toDataURL()});index++;
  }
  }finally{Math.random=physicsRandom;}
 }});
 for(const capture of captures){const el=document.createElement('article');el.className='card';const h=document.createElement('h2');h.textContent=`${kind==='base'?'기존':'경로 판독 후보'} · ${capture.t.toFixed(3)}초`;const img=new Image();img.src=capture.image;const meta=document.createElement('div');meta.className='meta';meta.textContent=`${capture.alive?'생존':'목의 치명상으로 사망'}\n방어선: ${{thrust:'중앙 찌르기',highL:'위쪽 사선',highR:'반대쪽 위',highC:'머리 위'}[capture.line]??'해제'}`;el.append(h,img,meta);document.querySelector('#shots').append(el);shots.push({...capture,image:undefined});}
 shots.push({kind,health,stamina:result.stamina,transitions:result.transitions});
}
window.result=shots;window.ready=true;
</script></html>
