<!doctype html><html lang="ko"><meta charset="utf-8"><title>일본 막기 · 흘림과 반격 입력 연구</title><link rel="icon" href="data:,"><style>body{margin:0;padding:20px;background:#202329;color:#e7dcc6;font:17px sans-serif}h1{font-size:25px;margin:0 0 10px}p,footer{font-size:16px;color:#c8bfaf;line-height:1.5}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.card{padding:10px;background:#2a2e34;border:1px solid #575a60}h2{font-size:17px;margin:0 0 8px}img{width:100%;display:block}.meta{margin-top:8px;line-height:1.5;white-space:pre-line}</style>
<h1>일본 막기 연구 · 흘린 뒤 베기 입력이 들어온 순간</h1><p>실제 게임 모델·물리 엔진 / 로컬 연구판의 동일 입력·동일 상대<br>위: 기존. 아래: 공격 입력 때 흘림 자세를 놓는 후보. 파란 선은 플레이어 칼, 주황 선은 상대 칼입니다.</p><main class="grid" id="shots"></main><footer>0.22~0.32초의 반응 지연을 둔 입력 대본입니다. 실제 인간 플레이 시험은 아닙니다.<br>자세가 풀리는 것과 유리한 반격은 별개이며, 이 장면만으로 전투 개선을 판정하지 않습니다.</footer>
<script>window.process={env:{}};</script><script type="module">
import * as THREE from 'three';
import {live} from './japanese_flow_live.mjs';
const renderer=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});renderer.setSize(384,340);renderer.setPixelRatio(1);renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.setClearColor(0x45464a);renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.2;
const camera=new THREE.PerspectiveCamera(34,384/340,.05,40),shots=[];
let visualSeed=7919;const visualRandom=()=>{visualSeed=(Math.imul(visualSeed,1664525)+1013904223)>>>0;return visualSeed/4294967296;};
for(const kind of ['base','free-cut']){
 let initialized=false,index=0,markers,center;const captures=[],times=[4.5583333333,4.825,4.95];
 const result=live({kind,seed:502,atk:'qinggang',policy:'slash',seconds:5.3,onFrame(G,g){
  const physicsRandom=Math.random;Math.random=visualRandom;try{
  const scene=G.player.scene;
  if(!initialized){initialized=true;scene.add(new THREE.HemisphereLight(0xfff8e8,0x4e5060,2.1));const sun=new THREE.DirectionalLight(0xfff2d2,2.5);sun.position.set(-3,6,5);scene.add(sun);const floor=new THREE.Mesh(new THREE.PlaneGeometry(12,12),new THREE.MeshStandardMaterial({color:0x5d5b54,roughness:1}));floor.rotation.x=-Math.PI/2;floor.position.y=-.005;scene.add(floor);markers=[0x7fcfff,0xffa74f].map(color=>{const line=new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(),new THREE.Vector3()]),new THREE.LineBasicMaterial({color,depthTest:false}));line.renderOrder=10;scene.add(line);return line;});}
  if(index<times.length&&G.t+1e-8>=times[index]){
   G.player.syncMeshes();G.enemy.syncMeshes();const a=G.player.bodies.chest.translation(),b=G.enemy.bodies.chest.translation();center??=new THREE.Vector3((a.x+b.x)/2,1.25,(a.z+b.z)/2);camera.position.copy(center).add(new THREE.Vector3(-2.7,1.25,4.2));camera.lookAt(center);
   for(const [i,f] of [G.player,G.enemy].entries())markers[i].geometry.setFromPoints([f.bladePoint(0,new THREE.Vector3()),f.bladePoint(1,new THREE.Vector3())]);renderer.render(scene,camera);
   captures.push({kind,t:G.t,active:g.active,broken:g.broken,force:G.player.skill._cover?.forceT??0,cover:G.player.skill._cover?.w??0,image:renderer.domElement.toDataURL()});index++;
  }
  }finally{Math.random=physicsRandom;}
 }});
 for(const [i,capture] of captures.entries()){const el=document.createElement('article');el.className='card';const h=document.createElement('h2');h.textContent=`${kind==='base'?'기존':'입력 우선 후보'} · ${['흘림 직후','베기 입력 +0.03초','베기 입력 +0.16초'][i]}`;const img=new Image();img.src=capture.image;const meta=document.createElement('div');meta.className='meta';meta.textContent=`${capture.t.toFixed(3)}초 · ${capture.broken?'공격 입력으로 막기 해제':'막기 중'}\n흘림 강제 유지: ${Math.max(0,capture.force).toFixed(3)}초 / 방어 목표 ${(capture.cover*100).toFixed(0)}%`;el.append(h,img,meta);document.querySelector('#shots').append(el);shots.push({...capture,image:undefined});}
 shots.push({kind,health:result.health,enemy:result.enemy,commands:result.commands,flows:result.flows});
}
if(new URLSearchParams(location.search).has('focus')){
 document.querySelector('#shots').style.gridTemplateColumns='repeat(2,1fr)';
 [...document.querySelector('#shots').children].forEach((el,i)=>{if(i!==2&&i!==5)el.remove();});
 document.querySelector('h1').textContent='일본 막기 · 반격 입력 후에도 남는 방어 목표';
 document.querySelector('p').innerHTML='실제 게임 엔진 / 같은 장면·같은 베기 입력 +0.16초<br>왼쪽 기존 · 오른쪽 입력 우선 후보. 파란 선은 플레이어 칼, 주황 선은 상대 칼입니다.';
}
window.result=shots;window.ready=true;
</script></html>
