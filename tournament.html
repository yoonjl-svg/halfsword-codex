<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#211a13" />
    <link rel="icon" href="data:," />
    <title>Stillness · 생사전 — 3인의 맹약</title>
    <style>
      @font-face {
        font-family: Pretendard;
        src: url("./fonts/Pretendard-Regular.subset.woff2");
      }
      @font-face {
        font-family: Pretendard;
        src: url("./fonts/Pretendard-SemiBold.subset.woff2");
        font-weight: 600;
      }
      @font-face {
        font-family: Pretendard;
        src: url("./fonts/Pretendard-Bold.subset.woff2");
        font-weight: 700;
      }
      @font-face {
        font-family: Cinzel;
        src: url("./fonts/Cinzel-latin.woff2");
        unicode-range: U+0041-005A, U+0061-007A;
      }
      :root {
        --c-text: #f3e9d8;
        --c-sub: #b8a88e;
        --c-accent: #d9a441;
        --c-on-accent: #1b1410;
        --c-alert: #e48e8b;
        --c-wander: #3d6b62;
        --c-wander-line: #6f9c8f;
        --panel: rgba(24, 18, 14, 0.88);
        --line: rgba(243, 233, 216, 0.18);
        --fs-s: 12px;
        --fs-m: 14px;
        --fs-l: 17px;
        --fw-body: 400;
        --fw-label: 600;
        --fw-head: 700;
        --lh-tight: 1.25;
        --lh-text: 1.4;
        --tier-trash: #b8b6b0;
        --tier-common: #fff3c4;
        --tier-rare: #8cc4ff;
        --tier-epic: #d6a8ff;
        --tier-legend: #ffd24a;
        --tier-mystery: #8fe3c6;
        --font-ui: Cinzel, Pretendard, sans-serif;
        color-scheme: dark;
        font-family: var(--font-ui);
        background: #211a13;
        color: var(--c-text);
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
      }
      button,
      input,
      select {
        font: inherit;
      }
      button {
        cursor: pointer;
      }
      #bootError {
        padding: 24px;
      }
      #oathTestTools {
        position: fixed;
        z-index: 30;
        bottom: 6px;
        left: 8px;
        font-size: 12px;
        background: #17110cf2;
        border: 1px solid #67523a;
        border-radius: 6px;
        max-width: calc(100vw - 16px);
      }
      #oathTestTools summary {
        padding: 5px 8px;
        cursor: pointer;
        color: #b9ac98;
      }
      #oathTestTools section {
        padding: 8px;
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
        max-width: 480px;
      }
      #oathTestTools button {
        background: #36291b;
        color: #f3e9d8;
        border: 1px solid #756145;
        border-radius: 4px;
        padding: 7px;
        font: inherit;
      }
      #oathTestTools p {
        margin: 2px 0;
        width: 100%;
      }
      #globalStatus {
        position: fixed;
        z-index: 40;
        left: 50%;
        bottom: 45px;
        transform: translateX(-50%);
        background: #21170cf5;
        border: 1px solid #ad8751;
        padding: 10px;
        max-width: 90vw;
        font-size: 14px;
        border-radius: 6px;
      }
      #globalStatus:empty {
        display: none;
      }
    </style>
  </head>
  <body>
    <div id="tournamentApp"></div>
    <p id="globalStatus" role="status" aria-live="polite"></p>
    <details id="oathTestTools">
      <summary>시험 도구</summary>
      <section>
        <p>검토판 · 이 기기에 저장 · NPC 대진은 모의 결과</p>
        <p id="testClock"></p>
        <button data-clock="registration">신청 시간으로</button
        ><button data-clock="start">개막 시각으로</button
        ><button data-clock="next">다음 경기 시각으로</button
        ><button data-clock="real">실제 시각</button
        ><button id="testReset">새 대회로 초기화</button
        ><button id="testVictory">승리 결과 시험</button
        ><button id="testDefeat">패배 결과 시험</button>
      </section>
    </details>
    <script type="module" src="/src/tournament/boot.js"></script>
  </body>
</html>
